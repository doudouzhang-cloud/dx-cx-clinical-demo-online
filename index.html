// Disclosure follows the current task; only presentation changes, no clinical state mutation.
const disclosureBaseRender=render,disclosureBaseAction=action;
let disclosureMemory={},disclosureReset=false;
function foldPanel(node,key,title,description,opened=false){
 if(!node)return;
 const box=document.createElement('details');box.className='task-disclosure';box.dataset.foldKey=key;
 box.open=Object.hasOwn(disclosureMemory,key)?disclosureMemory[key]:opened;
 const summary=document.createElement('summary');summary.innerHTML=`<b>${esc(title)}</b><small>${esc(description)}</small>`;
 node.replaceWith(box);box.append(summary,node);
 box.addEventListener('toggle',()=>{if(box.isConnected)disclosureMemory[key]=box.open});
}
action=function(a,id){if(a==='reset'){disclosureMemory={};disclosureReset=true;}return disclosureBaseAction(a,id)};
render=function(){
 if(!disclosureReset)document.querySelectorAll('[data-fold-key]').forEach(el=>disclosureMemory[el.dataset.foldKey]=el.open);disclosureReset=false;
 disclosureBaseRender();
 const layout=document.querySelector('.research-stage');if(!layout)return;
 const patient=layout.querySelector('.patient-inner'),content=layout.querySelector('.content');
 // Introductory decoration is useful only before authorization, not on every subsequent form.
 if(flow.authorized)patient.querySelector('.stage-patient-hero')?.remove();
 const material=patient.querySelector('[data-review-anchor="patient-materials"]');
 if(material&&preparation.kind)foldPanel(material,'materials-'+flow.version,'病历资料 · '+materialCount()+' 份','已提交 · 需要补充或重新载入时展开');
 const catalog=content.querySelector('.research-catalog');
 if(catalog)foldPanel(catalog,'catalog','研究项目 · 共 '+PROJECTS.length+' 项','展开搜索、筛选招募状态或查看项目详情',!!researchQuery||researchStatus!=='全部');
 const hasUnread=extra.messages?.some(m=>m.from==='staff'&&!m.read);
 for(const section of [...patient.children]){

 if(heading==='我的项目进度'&&!state.records.length){section.remove();continue}
 if(heading.includes('消息')||heading.includes('沟通'))foldPanel(section,'patient-messages','患者消息与沟通',hasUnread?'有团队消息 · 展开查看':'展开联系团队或查看消息',!!hasUnread);
 if(heading.includes('补充')&&state.records.length)foldPanel(section,'supplement-'+heading,heading,'需要补充检查或治疗资料时展开');
 }
 if(state.page==='invite'&&flow.authorized){const card=content.querySelector('.card');if(card)foldPanel(card,'invitation-complete','患者已完成授权绑定','需要重新展示邀请二维码时展开')}
 // Keep the current action above reference information.
 if(state.page==='home'){
 content.querySelector('.stage-hero')?.remove();
 for(const section of [...content.children]){
 if(section.matches('section.card')&&section.querySelector('h2')?.textContent==='最近筛选'){
 if(preparation.screened)foldPanel(section,'recent-results','最近筛选','展开查看已完成的初筛结果');else section.remove();
 }
 }
 }
 const guide=layout.querySelector('.guide');

 guide.querySelector('.stage-source')?.remove();
 const toolbar=document.querySelector('.dx-clinical-toolbar');
 const nav=toolbar?.querySelector('.flow-nav');
 nav?.remove();
};

const permissionsInitial=()=>({roles:[{id:'admin',name:'管理员',scope:'all',people:[],invite:true},{id:'member',name:'普通用户',scope:'self',people:[],invite:false}],members:[{id:'chief',name:'黄隽主任（演示）',job:'团队总览',role:'super'},{id:'doctor',name:'接诊医生 A（演示）',job:'初筛医生',role:'member'},{id:'crc',name:'协调员 B（演示）',job:'CRC',role:'member'},{id:'pi',name:'研究者 C（演示）',job:'PI 研究者',role:'admin'}],draft:null,error:'',preview:'doctor',logs:[],serial:0});
let permissions=permissionsInitial();
const scopeNames={self:'仅本人邀请的患者',specific:'指定成员邀请的患者',all:'全团队患者'};
function permissionPreview(){const m=permissions.members.find(x=>x.id===permissions.preview),r=permissions.roles.find(x=>x.id===m.role);const owners=m.role==='super'||r?.scope==='all'?permissions.members:r?.scope==='specific'?permissions.members.filter(x=>r.people.includes(x.id)):[m];return `<div class="permission-preview"><h3>授权效果预览</h3><label>查看成员<select id="permission-preview">${permissions.members.map(x=>`<option value="${x.id}" ${x.id===m.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><p>可查看：${owners.map(x=>esc(x.name)).join('、')}邀请的患者</p><p>邀请医生：${m.role==='super'||r?.invite?'允许':'不允许'}</p><small>此处实时预览配置结果；未连接真实账号，科研审批仍按初筛、CRC、PI 职责执行。</small></div>`}

function permissionPage(){return `<section class="dx-reference permissions-page"><div class="dx-team-banner"><small>团队管理</small><h1>黄隽团队 · 成员与权限</h1><p>当前以团队超级管理员身份配置 · 全部为演示成员</p></div><section class="card"><h2>团队成员</h2><p class="muted">选择权限角色，调整患者可见范围和邀请能力。科研职责单独保留。</p>${permissions.members.map(m=>`<div class="permission-member"><div><b>${esc(m.name)}</b><small>科研职责：${m.job}</small></div>${m.role==='super'?'<span class="pill">超级管理员 · 固定</span>':`<label>权限角色<select data-permission-member="${m.id}">${permissions.roles.map(r=>`<option value="${r.id}" ${r.id===m.role?'selected':''}>${esc(r.name)}</option>`).join('')}</select></label>`}</div>`).join('')}</section><section class="card"><div class="row between"><h2>角色与权限</h2><button class="primary" data-permission="new">＋ 新增角色</button></div>${permissionEditor()}<div class="permission-roles">${permissions.roles.map(r=>`<article><div class="row between"><b>${esc(r.name)}</b><button data-permission="edit" data-id="${r.id}">编辑</button></div><p>患者范围：${scopeNames[r.scope]}</p>${r.scope==='specific'?`<p>指定成员：${r.people.map(id=>esc(permissions.members.find(m=>m.id===id)?.name||id)).join('、')}</p>`:''}<p>免审批邀请医生：${r.invite?'开':'关'}</p><small>成员数：${permissions.members.filter(m=>m.role===r.id).length}</small></article>`).join('')}</div></section><section class="card">${permissionPreview()}</section><details class="card"><summary>本次权限变更记录 · ${permissions.logs.length} 条</summary>${permissions.logs.map(l=>`<p>${esc(l)}</p>`).join('')||'<p>暂无变更。</p>'}</details><p class="muted">左侧演示角色用于演示科研操作，不代表正在配置的团队成员账号。恢复初始会清除本次模拟授权。</p></section>`}

function permissionCommand(cmd,id){permissions.error='';if(cmd==='new')permissions.draft={id:null,name:'',scope:'self',people:[],invite:false};if(cmd==='edit')permissions.draft=JSON.parse(JSON.stringify(permissions.roles.find(r=>r.id===id)));if(cmd==='cancel')permissions.draft=null;if(cmd==='save'){const d=permissions.draft;d.name=d.name.trim();if(!d.name)permissions.error='请填写角色名称';else if(permissions.roles.some(r=>r.id!==d.id&&r.name===d.name))permissions.error='角色名称已存在';else if(d.scope==='specific'&&!d.people.length)permissions.error='请选择至少一位患者邀请人';else if(flow.failNext){flow.failNext=false;permissions.error='模拟保存失败，填写内容已保留，请重试'}else{if(!d.id)d.id='custom-'+(++permissions.serial);const i=permissions.roles.findIndex(r=>r.id===d.id);const saved=JSON.parse(JSON.stringify(d));if(i<0)permissions.roles.push(saved);else permissions.roles[i]=saved;permissions.logs.unshift('保存角色：'+d.name+' · '+scopeNames[d.scope]);permissions.draft=null;}}permissionRefresh()}
render=function(){permissionsBaseRender();permissionBind()};
function permissionBind(){if(shellSection!=='team')return;document.querySelectorAll('[data-permission]').forEach(el=>el.onclick=()=>permissionCommand(el.dataset.permission,el.dataset.id));document.querySelectorAll('[data-permission-member]').forEach(el=>el.onchange=()=>{const m=permissions.members.find(x=>x.id===el.dataset.permissionMember);if(flow.failNext){flow.failNext=false;permissionRefresh();toast('模拟分配失败，原权限角色已保留');return}m.role=el.value;permissions.logs.unshift('分配角色：'+m.name+' → '+permissions.roles.find(r=>r.id===m.role).name);permissionRefresh()});document.querySelector('#permission-preview').onchange=e=>{permissions.preview=e.target.value;permissionRefresh()};if(!permissions.draft)return;document.querySelector('#permission-name').oninput=e=>permissions.draft.name=e.target.value;document.querySelector('#permission-invite').onchange=e=>permissions.draft.invite=e.target.checked;document.querySelectorAll('[name="permission-scope"]').forEach(el=>el.onchange=()=>{permissions.draft.scope=el.value;permissionRefresh()});document.querySelectorAll('[data-permission-person]').forEach(el=>el.onchange=()=>{const set=new Set(permissions.draft.people);el.checked?set.add(el.dataset.permissionPerson):set.delete(el.dataset.permissionPerson);permissions.draft.people=[...set]})};

function permissionRefresh(){
 const page=document.querySelector('.permissions-page');
 if(!page){render();return}
 const scrolls=[];for(let node=page.parentElement;node;node=node.parentElement)scrolls.push([node,node.scrollTop,node.scrollLeft]);
 const windowX=window.scrollX,windowY=window.scrollY;
 const focused=document.activeElement;
 const focusId=focused?.id;
 const scope=focused?.name==='permission-scope'?focused.value:null;
 page.outerHTML=permissionPage();
 permissionBind();
 const replacement=focusId?document.getElementById(focusId):scope?document.querySelector('[name="permission-scope"][value="'+scope+'"]'):null;
 replacement?.focus({preventScroll:true});
 for(const [node,top,left] of scrolls){node.scrollTop=top;node.scrollLeft=left}
 window.scrollTo({left:windowX,top:windowY,behavior:'instant'});
}

// Sidebar modules have distinct landing routes; the dual-end demo belongs to clinical only.
const moduleBaseNavigate=shellNavigate,moduleBaseRender=render;
shellNavigate=function(section){
 if(section==='clinical'){shellSection='clinical';state.page='home';state.modal=false;render();return}
 if(['tasks','patients','records'].includes(section)){
 shellSection=section;state.page={tasks:'progress',patients:'archive',records:'upload'}[section];state.modal=false;
 render();return;
 }
 moduleBaseNavigate(section);
};
render=function(){
 moduleBaseRender();
 const moduleNames={tasks:['任务中心','科研项目待办'],patients:['患者管理','患者队列、病历夹与沟通记录'],records:['病历整理','查看材料、核对信息与整理病历']};
 const item=moduleNames[shellSection];if(!item)return;
 const workspace=document.querySelector('.dx-workspace');workspace.classList.add('standalone-module');
 const toolbar=workspace.querySelector('.dx-clinical-toolbar');toolbar.querySelector('div>b').textContent=item[0];toolbar.querySelector('div>span').textContent=item[1];
 toolbar.querySelector('.task-disclosure')?.remove();
 const product=workspace.querySelector('.product');product.setAttribute('aria-label',item[0]);
 const label=workspace.querySelector('.doctor-side .device-label');label.innerHTML=`<b>${item[0]}</b><span>${esc(ROLE_NAMES[role])}</span>`;
 if(shellSection==='tasks'||shellSection==='patients'&&state.page==='appointments'){const back=product.querySelector('.mobile-top>button');back.setAttribute('aria-label','返回医生首页');back.onclick=()=>shellNavigate('home');}
 // Auxiliary material actions may open a page inside the current module; sidebar selection remains accurate.
 product.scrollTop=0;
};

function cxCalendar(){const d=new Date(cxCalendarDate+'T12:00:00'),base=new Date(d);base.setDate(d.getDate()-((d.getDay()+6)%7));const tasks=state.records.flatMap(r=>[...(r.plan?[{date:r.plan.date,title:r.projectId+' · 入组前检查',text:r.plan.text}]:[]),...(r.followups||[]).map(f=>({date:f.date,title:r.projectId+' · 随访',text:f.content}))]).filter(t=>t.date===cxCalendarDate);return `<p class="muted">研究团队的检查与随访安排</p><label class="cx-date-picker">选择日期<input type="date" id="cx-calendar-date" value="${cxCalendarDate}"></label><div class="cx-week">${Array.from({length:7},(_,i)=>{const x=new Date(base);x.setDate(base.getDate()+i);const day=x.toLocaleDateString('en-CA');return `<button data-action="cxnav-day" data-id="${day}" aria-pressed="${day===cxCalendarDate}"><small>${'一二三四五六日'[i]}</small><b>${x.getDate()}</b></button>`}).join('')}</div><h3>${esc(cxCalendarDate)} · ${tasks.length} 项安排</h3>${tasks.map(t=>`<section class="card"><h3>${esc(t.title)}</h3><p>${esc(t.text)}</p></section>`).join('')||'<section class="card"><p>当天暂无检查或随访安排。</p><small>医生保存安排后，这里会同步显示。</small></section>'}${cxNavButton('research','查看我的科研任务')}`}
function cxSubpageMarkup(){const titles={appointment:'门诊预约与加号',folder:'病历夹',calendar:'健康日历',checks:'就诊沟通卡',doctor:'我的医生',messages:'团队消息',profile:'个人设置',hospital:'互联网医院问诊',music:'我的专属音乐',favorites:'收藏',chat:'与助手聊聊'};let body='';if(cxSubpage==='folder'){const reports=queueReports(),selected=reports.find(r=>r.id===cxSelectedReport);body=`<div class="cx-folder-banner"><b>病历档案</b><small>${flow.authorized?'已授权关联':'待授权关联'} · ${reports.length} 份资料</small></div><div class="cx-folder-tabs">${[['timeline','时间线'],['category','分类'],['metrics','关键指标']].map(([id,t])=>`<button data-action="cxnav-folder-tab" data-id="${id}" aria-pressed="${cxFolderTab===id}">${t}</button>`).join('')}</div>${selected?`<section class="card"><button data-action="cxnav-report-close">‹ 返回列表</button><h3>${esc(selected.title)}</h3><p>${esc(selected.text)}</p><small>${esc(selected.source)}</small></section>`:cxFolderTab==='metrics'?`<section class="card">${[['激素受体',state.patient.hr],['HER2',state.patient.her2],['ECOG',state.patient.ecog]].map(([k,v])=>`<p>${k}：${esc(preparation.kind?v||'待核对':'待提供')}</p>`).join('')}</section>`:reports.map(r=>`<button class="cx-report-row" data-action="cxnav-report" data-id="${esc(r.id)}"><small>${esc(cxFolderTab==='category'?r.category:r.date||'日期待补充')}</small><b>${esc(r.title)}</b><small>${esc(r.source)}</small></button>`).join('')||'<section class="card">暂无病历资料，补充后可在这里查看。</section>'}${cxNavButton('research','上传或补充病历','进入科研资料页面')}`}
else if(cxSubpage==='appointment')body=aptSuccessCards()+aptPatient();else if(cxSubpage==='calendar')body=cxCalendar();else if(cxSubpage==='doctor')body=`<section class="card"><span class="pill">我的研究团队</span><h2>黄隽教授团队</h2><p>中南大学湘雅医院 · 乳腺科</p><p>${flow.authorized?'已授权关联':'尚未授权绑定'}</p>${cxNavButton('research','进入科研任务')}${cxNavButton('messages','查看团队消息')}${cxNavButton('appointment','门诊预约与加号')}</section>`;
else if(cxSubpage==='checks')body=patientChecks()||'<section class="card"><h3>暂无复查安排</h3><p>研究团队保存入组前检查计划后，这里显示检查内容、日期、地点和准备事项。</p></section>';
else if(cxSubpage==='messages')body=extra.messages.length?extra.messages.map(m=>`<section class="card"><small>${esc(m.sender||'患者')} · ${esc(m.at)}</small><p>${esc(m.text)}</p></section>`).join('')+cxNavButton('research','联系研究团队','进入患者消息与沟通'):'<section class="card">暂无团队消息。</section>'+cxNavButton('research','联系研究团队');
else if(cxSubpage==='profile')body='<section class="card"><h3>演示患者 A</h3><p>仅使用虚构资料，不绑定真实手机号。</p></section>';
else if(cxSubpage==='chat')body=`<p class="muted">模拟对话记录；未连接 AI 诊疗服务。</p>${cxHistory.map(t=>`<div class="cx-home-message">${esc(t)}</div>`).join('')||'<section class="card">可以在首页输入问题，记录将保留在本次演示中。</section>'}${cxNavButton('home','返回首页输入问题')}`;
else body=`<section class="card"><h3>${cxSubpage==='favorites'?'暂无收藏':titles[cxSubpage]}</h3><p>${cxSubpage==='favorites'?'本次演示尚无收藏内容。':'已还原此菜单入口，本科研 Demo 尚未接入该服务。'}</p></section>`;

action=function(a,id){if(a==='reset'){cxDrawer=false;cxSubpage='';cxHistory=[];cxHistoryQuery='';cxSelectedReport=''}if(a==='cx-menu'){cxDrawer=!cxDrawer;render();return}if(a==='cx-send'&&cxHomeDraft.trim())cxHistory.unshift(cxHomeDraft.trim());if(a==='cx-appointment')a='cxnav-appointment';if(a==='cx-chat')a='cxnav-chat';if(a==='cx-calendar')a='cxnav-calendar';if(a==='cx-report')a='cxnav-folder';if(a==='cx-home'||a==='cx-research'){cxSubpage='';cxDrawer=false}if(!a.startsWith('cxnav-'))return cxNavBase.action(a,id);const cmd=a.slice(6);if(cmd==='close'){cxDrawer=false;render();return}if(cmd==='home'){cxView='home';cxSubpage='';cxDrawer=false;render();return}if(cmd==='research'){cxSubpage='';cxDrawer=false;cxView='research';render();return}if(cmd==='appointment')apt.view='home';if(cmd==='folder-tab'){cxFolderTab=id;cxSelectedReport=''}else if(cmd==='report')cxSelectedReport=id;else if(cmd==='report-close')cxSelectedReport='';else if(cmd==='day')cxCalendarDate=id;else{cxSubpage=cmd;cxDrawer=false;cxSelectedReport=''}render()};
render=function(){cxNavBase.render();const device=document.querySelector('.patient-device');if(!device)return;if(cxSubpage){device.classList.add('cx-home-device');const previousRole=role;role='patient';device.innerHTML=cxSubpageMarkup();role=previousRole}if(cxDrawer)device.insertAdjacentHTML('beforeend',cxDrawerMarkup());device.querySelectorAll('[data-action^="cxnav-"],[data-action="cx-menu"]').forEach(el=>el.onclick=()=>action(el.dataset.action,el.dataset.id));device.querySelectorAll('[data-action^="apt-"]').forEach(el=>el.onclick=()=>action(el.dataset.action,el.dataset.id));device.querySelectorAll('[data-apt-field]').forEach(el=>el.addEventListener('input',()=>{apt.draft[el.dataset.aptField]=el.value}));device.querySelector('#cx-history-search')?.addEventListener('input',e=>{cxHistoryQuery=e.target.value;device.querySelector('#cx-history-list').innerHTML=cxHistoryMarkup();device.querySelectorAll('.cx-history-row').forEach(el=>el.onclick=()=>action('cxnav-chat'))});device.querySelector('#cx-calendar-date')?.addEventListener('change',e=>{if(e.target.value){cxCalendarDate=e.target.value;render()}});device.querySelectorAll('[data-action="patient-check-ack"]').forEach(el=>el.onclick=()=>action(el.dataset.action,el.dataset.id))};

// Preserve the workspace while render wrappers rebuild and reparent both devices.
const stableViewBaseRender=render;
let stableViewKeys=null;
function viewKeys(){return {shell:shellSection,doctor:state.page+':'+(state.page==='case'?flow.caseId||'':''),patient:cxView+':'+cxSubpage,guide:demoStep()}}
render=function(){
 const app=document.querySelector('#app'),next=viewKeys(),previous=stableViewKeys;
 const outer={x:window.scrollX,y:window.scrollY};
 const selectors=['.dx-sidebar','.product','.patient-device','.cx-sit-scroll','.guide','.flow-layout'];
 const positions=selectors.map(selector=>{const el=document.querySelector(selector);return {selector,top:el?.scrollTop||0,left:el?.scrollLeft||0}});
 const minHeight=app?.style.minHeight||'';
 // Retain document height during synchronous DOM replacement so the browser
 // cannot clamp the surrounding page to the top between render layers.
 if(app)app.style.minHeight=app.getBoundingClientRect().height+'px';
 try{stableViewBaseRender();
  const sameShell=previous&&previous.shell===next.shell;
  if(sameShell){for(const saved of positions){const el=document.querySelector(saved.selector);if(!el)continue;
   const same=saved.selector==='.product'?previous.doctor===next.doctor:['.patient-device','.cx-sit-scroll'].includes(saved.selector)?previous.patient===next.patient:saved.selector==='.guide'?previous.guide===next.guide:true;
   el.scrollTop=same?saved.top:0;el.scrollLeft=same?saved.left:0;
  }}
 }finally{if(app)app.style.minHeight=minHeight;stableViewKeys=viewKeys();}
 if(previous&&previous.shell===next.shell)window.scrollTo({left:outer.x,top:outer.y,behavior:'instant'});
};

render();</script></body></html>
