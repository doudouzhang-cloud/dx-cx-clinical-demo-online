    "sourceText": "3.解救RX0074-黄隽\n一项评估Saruparib（AZD5305）联合Camizestrant相比医生选择的CDK4/6抑制剂联合内分泌治疗或联合Camizestrant用于BRCA1、BRCA2或PALB2突变的激素受体阳性、HER2阴性（IHC 0、1+、2+/ISH未扩增）晚期乳腺癌患者一线治疗的随机、开放性、III期研究（EvoPAR-Breast01）\nSaruparib（AZD5305）第二代PARP抑制剂；Camizestrant口服选择性雌激素受体降解剂 (SERD)\n目标患者：携带BRCA1、BRCA2或PALB2突变的HR阳性、HER2阴性晚期乳腺癌患者\n入选标准：1、有基于当地实验室检测经组织学或细胞学检查诊断为HR阳性、HER2阴性乳腺癌的记录。\n2、至少一个病灶（可测量和/或不可测量）可在基线时准确评估，并且适合根据RECIST v1.1标准进行重复评估。\n3、基于CLIA/CAP认证实验室或当地认证实验室检测结果的胚系BRCA1、BRCA2或PALB2功能丧失性突变或基于中心实验室肿瘤检测结果的肿瘤BRCA1、BRCA2或PALB2功能丧失性突变。\n4、FFPE肿瘤样本可用，将用于中心实验室BRCA1、BRCA2和PALB2组织检测以及用于额外生物标志物分析和伴随诊断方法开发\n5、非绝经后或未接受子宫切除术的女性必须在随机化前28天内和每个研究治疗周期前记录为妊娠试验阴性。\n排除标准：\n1.新辅助化疗或辅助化疗末次给药后≤84天疾病进展。\n2.以下药物末次给药后≤365天疾病进展：\n   · 用于早期乳腺癌的PARPi和/或铂类药物\n   · 辅助治疗背景下的CDK4/6i\n   · 口服SERD，包括camizestrant\n3.有MDS/AML病史或具有提示MDS/AML的特征\n4.难治性恶心和呕吐或慢性胃肠道疾病\n5.QTcF>470 ms，除非受试者计划接受瑞波西利，这种情况下，以QTcF>450 ms为排除标准\n6.静息状态心电图节律、传导或形态方面的任何具有临床意义的异常，如三度心传导阻滞\n7.对于正在使用降低心率的合并用药的受试者，静息心率<55 bpm；或有卒中病史、或未控制的冠状动脉心脏疾病、或心脏节律障碍 \n8.其他原发性恶性肿瘤病史。以下情况例外：\n   · 经充分切除的非黑色素瘤皮肤癌\n   · 已治愈的原位疾病\n   · 恶性肿瘤在研究治疗首次给药前≥2年接受根治性治疗，并且在干预治疗期间无已知的活动性疾病\n9.任何原因导致的持续性（>2周）重度血细胞减少症（如，ANC<0.5×109/L或血小板<50×109/L）病史。\n10.既往抗癌治疗导致出现持续性毒性（≥CTCAE 2级），脱发除外。对于出现毒性的受试者，如果研究者合理预期毒性不会影响受试者接受研究干预治疗的安全性（例如，激素疗法相关副作用），则经研究临床负责人同意，可入选该受试者。\n11.患有脊髓压迫、脑部转移、癌性脑膜炎、或软脑膜疾病，除非经过彻底的局部治疗且在开始研究干预治疗前至少4周达到无症状、稳定、并且不需要类固醇治疗的状态。脑部放疗结束到研究入组必须至少间隔2周。\n",

    "id": "RX0098",
    "heading": "6.RX0098-黄隽 ",
    "title": "评价 VB15010 片治疗晚期实体瘤受试者的安全性、耐受性、药代动力学、药效学和初步疗效的 I/II 期临床研究",
    "status": "招募状态待 CRC 核实",
    "sourceText": "6.RX0098-黄隽 \n评价 VB15010 片治疗晚期实体瘤受试者的安全性、耐受性、药代动力学、药效学和初步疗效的 I/II 期临床研究\n组别： A 部分（I 期）：预计将需要25-48 例受试者。B 部分（II 期）：计划入组140 例受试者（对于A 部分中符合Ⅱ期试验入组标准、且接受了RP2D 治疗的受试者，将考虑纳入II 期研究分析）。剂量递增试验，根据受试者情况选择不同剂量组别\n联系人： 陈思雨151****4512 何霞  185****0502\nVB15010是第2代的特异性选择PARP1\n目标患者（后续可能更新）：三阴性乳腺癌、HR+,HER2-乳腺癌\n入选标准：1、年龄18至75（包括18和75）周岁，男女均可。\n2、有证据证明为局部晚期不可切除或转移性实体瘤（不包括淋巴瘤）且既往接受标准治疗失败或治疗后复发、或无有效标准治疗的患者。对于CRPC患者，疾病进展应符合以下三个标准中的一个或多个（根据PCWG3):(1)PSA进展，定义为至少2次PSA水平升高，每次测定间隔≥1周，且筛选时的PSA值应≥1ng/mL （μg/L);(2)RECIST 1.1标准中定义的软组织／内脏疾病进展；(3）骨病灶进展定义为骨扫描时发现至少两个新增病灶，针对模棱两可的结果采用另一种或成像技术（例如：CT或MRI）进行确认。\n3、原则上入组前必须纳入携带特定胚系或体系致病性／疑似致病性 HRR 基因（特定 HRR 基因包括 BRCA1/2、PALB2、RAD51C、RAD51D、ATM）突变的患者，对于不携带上述规定HRR 基因突变的部分患者经研究者与申办方共同评估商议，若认为存在疗效获益可能，也可纳入本研究。\n4、ECOG评分0~1，且在筛选前2周内未恶化。\n5、预期寿命≥3个月。\n6、足够的骨髓和器官功能：(1）骨髓功能（筛查前14天内未输血、未使用细胞生长因子纠正）：血红蛋白≥100g/L，血小板计数≥100x10~9/L，绝对中性粒细胞计数(ANC)≥1.5×10∧9/L;；(2）肝肾功能（筛选前14天内未输白蛋白）：根据 Cockcroft-Gault 等式测得肌酐清除率＞60rmL/min。血清总胆红素≤1.5 倍正常值上线（ULN),ALT和AST≤2.5×ULN（对于合并有肝转移的患者，总胆红素≤2.5×ULN，AST和ALT≤5xULN);(3）凝血功能：国际标准化比值（INR）≤2.3或凝血酶原时间（PT）和活化部分凝血酶原时间（APTT）≤1.5×ULN（除非受试者正在接受抗凝治疗，且抗凝治疗患者的水平应在治疗范围内，注意，如果患者正在接受抗凝治疗，研究者应密切监测这些实验室检查值）。\n7、受试者自愿提供新鲜血液用于BRCA1/2、PALB2、RAD51C/D等HRR基因突变检测和PARylation检测。对于B部分，筛选时，必须提供福尔马林固定和石蜡包埋（FFPE）肿瘤标本（对于A部分不强制）。\n8、根据 RECISTv1.1，至少要求存在一个可测量的靶病灶。但在剂量爬坡阶段允许具有至少一个可评估病灶的受试者入组，以及部分无可测量病灶的前列腺癌受试者入组。\n9、患者最多允许不超过一种基于PARPi的方案治疗（作为治疗或维持）。\n对于B部分：(1)HER2阴性的乳腺癌：既往标准治疗方案不超过3线。如无禁忌，既往至少接受过1次化疗，如激素受体（HR）阳性，既往至少接受过一次内分泌治疗；(2）去势抵抗性前列腺癌（CRPC)：既往标准治疗方案不超过4线。患者必须持续使用 GnRH 类似物或睾丸切除术（即手术或药物阉割）进行雄激素剥夺治疗；(3）卵巢癌：既往标准治疗方案不超过4线；(4）胰腺癌：既往标准治疗方案不超过2线。患者可能既往受过放射治疗（不计入治疗方案线数）。\n排除标准：1、开始使用研究药物前，存在既往抗肿瘤治疗导致的仍未恢复至≤CTCAE1级的毒性。但允许任何级别的脱发患者入组本研究。\n2、首次给药前4周内接受过放疗、化疗、手术治疗、免疫治疗、靶向治疗、抗肿瘤生物治疗、激素治疗等抗肿瘤治疗（特例：有限范围放射治疗，需要2周洗脱期；亚硝脲或丝裂霉素C治疗，需要6周洗脱期；口服氟尿嘧啶类药物，需要2周洗脱期；小分子靶向治疗，需要2周洗脱期；NMPA批准的中成药治疗，需要2周洗脱期，包括：复方斑蝥胶囊、康艾注射液、康莱特胶囊／注射剂、艾迪注射液、鸦胆子油注射剂／胶囊、消癌平片／注射剂、华蟾素胶囊等；部分情形不满4周，如研究者判断已无明显影响或已充分洗脱的，纳入之前需与申办者商讨而定）。\n3、首次给药前4周内进行过除诊断性手术之外的重大手术，或明显创伤性损伤，长期未愈的伤口或骨折（病理性骨折除外）。\n4、既往接受过试验性且目前仍未获批上市的PARPi治疗。\n5、研究治疗开始前4周（如先前参与试验的药物为小分子类，则为5个半衰期）内参加过其它药物临床试验。\n6、患者在首次给药前3年内或当前同时患有其它恶性肿瘤。以下两种情况可以入组：经单一手术治疗的其他恶性肿瘤，达到连续5年的无疾病生存（DFS)；已治愈的皮肤基底细胞癌、子宫颈原位癌、非黑色素瘤的皮肤癌和表浅的膀胱肿瘤，达到连续5年的无疾病生存（DFS）。\n7、已知存在活动性CNS转移和／或癌性脑膜炎：\n已治疗的脑转移受试者如果病情稳定且未出现以下情况，则可参加研究：\n·进行性或新发神经功能缺损、癫痫发作、颅内压升高证据、呕吐、视乳头水肿或头痛；\n·本研究首次给药前至少4周内经影像学评估有CNS肿瘤复发／进展的证据；\n·有新发脑转移或脑转移扩大的证据。\n8、任何原因导致的持续2周及以上的严重（CTCAE≥3级）全血细胞减少的病史，除非无症状、且经治疗后病情稳定。\n9、患者不能吞咽制剂或存在可能影响研究药物无法充分吸收的胃肠道功能损害或胃肠道疾病（例如，既往部分或完全胃切除术、既往Roux-en-Y或Whipple手术、未治愈的胃或十二指肠溃疡、胃炎、未控制／难治性的恶心、呕吐、腹泻、吸收不良综合征或重大肠切除术），或近期（1个月以内）发生过肠梗阻、胃肠道穿孔者。\n10、现患有活动性肝炎、肝性脑病、肝肾综合征或≥Child-PughB级肝硬化者。\n11、患者目前记录有严重间质性肺病（ILD）、药物诱发的ILD、需要类固醇治疗的放射性肺炎病史，或任何活动性ILD的临床证据（应检查用于肿瘤评估的基线胸部CT扫描，确认不存在相关肺部并发症）。\n12、患者患有具临床意义的、未能控制的心脏病和／或近期心血管疾病，包括以下任何一种情况：\n·研究治疗开始前12个月内有心绞痛、有症状的心包炎或心肌梗死病史、短暂性脑缺血发作或中风病史、纽约心脏病协会（NYHA)II级以上的充血性心力衰竭病史、有临床意义的心脏瓣膜疾病；\n·记录的心肌病（如扩张型心肌病、肥厚型心肌病、限制型心肌病、未定型心肌病、致心律失常性右室心肌病）；\n·研究治疗开始前12个月内出现任何具有临床意义的心律失常（如室性心动过速、室性颤动、尖端扭转、完全性左束支传导阻滞、高度房室传导阻滞，如双束支传导阻滞、Mobitz II型II度或III度房室传导阻滞）等）； \n·药物控制不良的高血压，定义为收缩压(SBP)≥150nmmHg 和／或舒张压(DBP)≥90mmHg。允许在筛选前开始或调整抗高血压药物治疗；\n·任何增加QT延长或缩短风险或发生心律失常事件风险的因素（如未控制的低钾血症或低镁血症、先天性长QT或短QT综合征、家族性长QT综合征或短QT综合征或特发性猝死、或在研究期间需长期合并使用已知可延长或缩短QT的药物和／或已知导致尖端扭转型室性心动过速（TdP）风险的药物等）；\n·通过多门控采集（MUGA）扫描或超声心动图（ECHO）确定患者的左心室射血分数(LVEF)<50%;\n·筛选时，ECG或脉搏测定，静息时心率＜50；\n·筛选时，ECG检查无法确定QTcF间期（即：不可读或无法解读），或校正QT(QTcF)>470ms（女性）/450ms（男性）（使用Fridericia校正）。均通过筛选期ECG（三次ECG的均值）确定；\n·筛选时，存在有症状的低血压患者。\n13、有出血倾向、和血栓史和癌栓史：(1）筛选前3个月内出现显著临床意义的出血症状或具有明确的出血倾向；(2）筛选前6个月内存在消化道出血病史或有明确的消化道出血倾向；(3）筛选前6个月内出现动／静脉血栓事件（无症状且无需临床干预的除外），例如脑血管意外（包括短暂脑缺血发作）、肺栓塞等；(4）筛选前6个月内出现增殖性糖尿病视网膜病变；(5）筛选前6个月内经影像学检查证实存在癌栓的情况；(6）筛选前3个月内影像学显示肿瘤已侵犯重要血管或经研究者判断患者在治疗期间有极高可能因肿瘤侵袭重要血管而引起致命大出血的情况。\n14、在开始研究治疗前2周内，存在2级或以上的活动性感染或首次服药前7天内有不明原因的发热（≥38.5℃）。\n15、有免疫缺陷病史，包括HIV检测阳性，或其他获得性、先天性免疫缺陷疾病；或未控制的自身免疫性疾病；或既往接受过器官移植、干细胞或骨髓移植；或需要持续接受剂量为＞10mg每日一次的泼尼松（或等效的皮质类固醇治疗）。\n16、具有临床意义的腹腔积液、胸腔积液及心包积液，定义为通过体格检查发现，并且经穿刺等治疗2周后，需要通过再次穿刺进行控制，或增加药物干预以维持症状（仅通过影像学检查才能发现少量积液的患者可以入选）。\n",

    "sourceText": "7.RX0099-黄隽\n注射用瑞康曲妥珠单抗不同剂量或德曲妥珠单抗治疗HR阳性HER2低表达的不可切除的局部复发/转移性乳腺癌的随机、开放、多中心II期临床研究\n联系人：戴炬 188****7346\n组别：治疗组A（瑞康曲妥珠单抗）：采用静脉滴注给药，每次6.4mg/kg，每3周给药1次（Q3W），每3周（21天）为1个治疗周期。治疗组B（瑞康曲妥珠单抗）：采用静脉滴注给药，每次4.8mg/kg，每3周给药1次（Q3W），每3周（21天）为1个治疗周期。\n治疗组C（德曲妥珠单抗）：采用静脉滴注给药，每次5.4mg/kg，每3周给药1次（Q3W），每3周（21天）为1个治疗周期。\n目标患者（后续可能更新）：复发转移阶段未接受过化疗的HR阳性、 HER2低表达的不可切除的局部复发/转移性乳腺癌患者。\n入选标准：\n1. 18岁至75岁（含两端值）的女性。\n2. 不可切除的局部复发或转移性乳腺癌，病理检测结果要求如下：\n    • 由中心实验室经组织学病理检测证实的HER2低表达（IHC 2+/ISH- or IHC1+），参考ASCO/CAP指南。\n    • 研究参与者如果存在多个既往HER2病理结果，则采用最近一次病理结果与中心实验室的HER2病理结果进行比较，以确定合格性，送检中心实验室的标本必须来源于疾病复发或转移阶段的肿瘤组织病理标本，且该标本需满足参研中心或外院病理诊断为HER2低表达；\n    • 允许纳入疾病复发或转移之前参研中心或外院病理检测结果为HER2 IHC 0或IHC（-）的研究参与者；\n    • 所有病理检测未曾诊断为HER2阳性（IHC 3+或ISH+）乳腺癌，参考ASCO/CAP指南。\n    • 经参研中心病理检测结果（外院病理结果需经参研中心会诊）为HR阳性，参考ASCO/CAP指南，HR阳性（ER阳性或PR阳性）定义为：阳性染色的肿瘤细胞占所有肿瘤细胞的比例≥1％。如果患者在疾病转移后有多个ER/PR结果，则采用最近的检测结果确认合格性。- 线数均以疾病进展来定义，未发生疾病进展的情况下，更换药物治疗或在原药物的基础上增加新的抗肿瘤药物，仍算作同一个线数。\n3. 既往治疗要求如下：\n    • 复发/转移阶段未接受过化疗。\n    • 复发/转移阶段接受过至少1个线数内分泌治疗且疾病进展，且研究者判断不能继续从内分泌治疗中获益。\n    • 辅助内分泌治疗从开始治疗后24个月内出现疾病进展，则辅助内分泌治疗算作1线内分泌治疗。\n关于既往系统性抗肿瘤治疗还需注意：\n    - 线数均以疾病进展来定义，未发生疾病进展的情况下，更换药物治疗或在原药物的基础上增加新的抗肿瘤药物，仍算作同一个线数。\n    - CDK4/6抑制剂、西达苯胺、PARP抑制剂、mTOR抑制剂或PI3-K抑制剂均属于靶向治疗，单药治疗不纳入内分泌治疗线数。\n4. 有记录证实的影像学疾病进展（最近一次治疗期间或之后）。\n5. ECOG评分（附件3）为0或1；\n6.预期生存期≥12周；\n7. 根据RECIST v1.1标准至少有一个颅外的可测量病灶作为靶病灶。\n8. 重要器官功能符合以下标准（首次用药前14天内未使用任何血液成分、细胞生长因子进行纠正治疗）：\n    •中性粒细胞绝对计数（ANC）≥1.5×109/L（1,500/mm3）；\n    •血小板≥100×109/L（100,000/mm3）；\n    •血红蛋白（Hgb）≥90g/L（9.0 g/dL）；\n    •白蛋白水平≥3.0 g/dL；\n    •总胆红素≤1.5×ULN；\n    •丙氨酸氨基转移酶（ALT）和天门冬氨酸氨基转移酶（AST）≤2.5×ULN（肝转移患者，ALT和AST≤5×ULN）；\n    •血清肌酐≤1.5×ULN或肌酐清除率≥60 mL/min（根据Cockcroft-Gault公式计算，附件4）；\n    •凝血酶原时间（PT）和活化部分凝血活酶时间（APTT）≤1.5×ULN；\n    •QTcF≤470 msec；\n    •超声心动图（ECHO）或心脏放射性核素扫描（MUGA）显示心脏左心室射血分数（LVEF）≥50%。\n9. 妊娠和避孕：\n    •有生育能力的女性（WOCBP）研究参与者须同意从研究筛选开始至接受末次研究药物治疗后7个月内采用高效的避孕措施（见附件2）且同意不哺乳；\n    •有生育能力的女性在首次治疗前7天内的血清妊娠试验结果必须为阴性。\n10. 患者自愿加入本研究，签署知情同意，有良好的依从性并愿意配合访视和研究相关程序。 \n排除标准：1.存在脑膜转移/癌性脑膜炎、脊髓压迫或活动性中枢神经系统转移，其中活动性中枢神经系统转移具体定义为未经治疗、或症状性、或需要皮质类固醇/抗惊厥药治疗以控制相关症状；但经过针对脑转移的治疗后稳定至少1个月且已停用皮质类固醇/抗惊厥药>2周者除外。\n2.仅皮肤或脑病灶作为靶病灶的患者。\n3.既往5年内患有其它恶性肿瘤，不包括已治愈的皮肤基底细胞癌和宫颈原位癌。\n4.存在癌性淋巴管炎、或无法通过引流等方法控制的第三间隙积液（如大量腹水、胸腔积液、心包积液）。\n5.无法吞咽、慢性腹泻、肠梗阻或存在影响药物服用和吸收的其他因素。\n6.既往使用过抗HER2药物。\n7.首次用药前6周内接受过丝裂霉素C和亚硝基脲化疗者。\n8.首次用药前4周内接受过手术治疗（穿刺活检、PICC置管、PORT输液港置管手术除外）、化疗（5-Fu类药物除外）、免疫治疗、大分子靶向治疗等；首次用药前2周内接受过内分泌治疗、5-Fu类药物化疗或放疗；小分子靶向药物需洗脱2周或5个半衰期（以较长者为准）；其他药物临床研究药物在首次用药前需洗脱4周或5个半衰期（以较长者为准）。\n9.既往接受过含依喜替康衍生物拓扑异构酶 I 抑制剂的抗体药物偶联物，如Enhertu（DS-8201a），既往接受过其它在研的靶向HER2的抗体药物偶联物。\n10.首次用药前2周内出于治疗目的使用过免疫抑制剂或全身激素治疗以达到免疫抑制目的者（剂量>10 mg/d泼尼松或同等药物生理学剂量的其他皮质类固醇激素），不包括鼻喷或吸入性皮质类固醇激素。\n11.有免疫缺陷病史，包括HIV检测阳性，其他获得性、先天性免疫缺陷疾病，或有器官移植史。\n12.存在有临床意义的心血管疾病，如重度/不稳定型心绞痛、有症状的充血性心力衰竭（NYHA ≥Ⅱ级）等，有临床意义且需治疗或干预的室上性或室性心律失常，首次用药前6个月内发生过心肌梗死、脑血管意外（包括一过性脑缺血发作）。\n13.已知或可疑有间质性肺炎的研究参与者；首次给药前三个月内存在其他可能干扰药物相关肺毒性检测或处理的、严重影响呼吸功能的中重度肺部疾病，包括但不限于特发性肺组织纤维化、机化性肺炎/闭塞性细支气管炎、肺栓塞、严重哮喘、严重慢性阻塞性肺疾病（COPD）、阻塞性/限制性肺病等；以及任何肺部受累的自身免疫性、结缔组织或炎症性疾病，例如类风湿性关节炎、干燥综合症、结节病等，或既往接受过全肺切除手术等。既往接受免疫检查点抑制剂治疗期间发生过≥3级间质性肺炎的研究参与者不允许入组本研究。\n14.已知存在的遗传性或获得性出血倾向（如血友病、凝血功能障碍等）。\n15.存在活动性乙型肝炎（HBsAg阳性且HBV DNA≥500 IU/mL）、丙型肝炎（丙肝抗体阳性且HCV RNA高于正常值范围上限）、肝硬化；或需要抗生素、抗病毒药或抗真菌药控制的严重感染者。\n16.根据NCI-CTCAE v6.0分级，既往抗肿瘤治疗导致的毒性尚未恢复至≤ Ⅰ 级者（脱发除外；根据研究者的判断，部分可耐受的慢性Ⅱ级毒性可除外）。\n17.已知对任一研究药物或其任何辅料过敏，或对人源化单克隆抗体产品（如曲妥珠单抗、帕妥珠单抗等）过敏者。\n18.存在其他严重身体或精神疾病或实验室检查异常，可能增加参与研究的风险，或干扰研究结果，以及研究者认为不适合参与本研究的患者。\n",

    "sourceText": "9.RX0077-黄隽\nSKB264 对比研究者选择的化疗治疗既往经内分泌治疗失败的不可手术切除的局部晚期、复发或转移性激素受体阳 性（HR+）/人表皮生长因子受体 2 阴性（HER2-）乳腺癌患者的随机、开放性、多中心Ⅲ期临床试验\n目标患者：既往经内分泌治疗失败的不可手术切除的局部晚期、复发或转移性激素受体阳性（HR+）/人表皮生长因子受体 2 阴性（HER2-）乳腺癌患者 \nSKB264（通用名：芦康沙妥珠单抗，sacituzumab tirumotecan）是一种靶向TROP-2的抗体药物偶联物（ADC）\n联系人：陶美玲  187****8303\n入选标准：1.基于最近活检或其他病理标本的病理报告，组织学和/或细胞学确诊为HR+/HER2-乳腺癌；\n2.既往未接受过针对局部晚期、复发或转移性阶段的系统性化疗；\n经研究者评估，不能继续从内分泌治疗中获益且适合接受一线化疗治疗，既往内分泌治疗要求，须满足下列条件之一：1）局部晚期、复发或转移阶段接受过一线或多线内分泌治疗，并出现疾病进展，至少有一线内分泌治疗联合细胞周期蛋白依赖性激酶4/6（CDK 4/6）抑制剂治疗失败；2）既往辅助阶段CDK 4/6抑制剂治疗联合内分泌治疗，在CDK 4/6抑制剂治疗期间复发，或完成CDK 4/6抑制剂治疗后12个月内复发；\n3.能提供足够的组织切片10-13片；\n4.有可测量病灶，ECOG评分0-1；\n排除标准：1.有中枢神经系统（CNS）转移（包括脑实质转移或脑膜转移）或癌性脑膜炎；\n2.存在需要类固醇治疗的（非感染性）间质性肺病（ILD）或非感染性肺炎病史，目前有ILD或非感染性肺炎，或筛选时存在无法经影像学检查排除的可疑ILD或非感染性肺炎；\n3.有记录的重度干眼综合征、重度睑板腺疾病和/或睑缘炎，或存在妨碍/延迟角膜愈合的严重角膜疾病病史；\n4.已知对SKB264或研究者选择的化疗或其任何辅料（包括但不限于聚山梨酯-20）过敏，或者对其他单克隆抗体发生过严重超敏反应；\n5.既往接受过TROP2靶向治疗或含有靶向拓扑异构酶I的化疗药物的任何治疗（包括ADC）；\n6.在筛选过程中，病情迅速恶化，例如体力状态的严重变化等；\n7.患有非恶性肿瘤导致的局部或全身性疾病，或肿瘤继发的疾病或症状，并可导致较高医学风险和/或生存期评价的不确定性，如肿瘤类白血病反应、恶病质表现等。\n",

    "title": "一项比较阿贝西利联合拉索昔芬或氟维司群用于雌激素受体阳性（ER+）、人表皮生长因子受体2阴性（HER2-）、雌激素受体1（ESR1）突变的绝经前/后女性和男性局部晚期或转移性乳腺癌患者的有效性和安全性的开放标签、随机、多中心研究",
    "status": "招募状态待 CRC 核实",
    "sourceText": "10.RX0070-黄隽:一项比较阿贝西利联合拉索昔芬或氟维司群用于雌激素受体阳性（ER+）、人表皮生长因子受体2阴性（HER2-）、雌激素受体1（ESR1）突变的绝经前/后女性和男性局部晚期或转移性乳腺癌患者的有效性和安全性的开放标签、随机、多中心研究\n目标患者： ER+/HER2-局部晚期或转移性乳腺癌；晚期接受过1线内分泌治疗（满足内分泌继发耐药）；既往接受过CDK4/6抑制剂联合内分泌治疗；晚期≤1线化疗\n入选标准：1.年龄≥18岁；\n2.绝经前或绝经后女性或男性。\n3.根据受试者最近一次活检获得的组织检测，确保受试者为ER+和HER2-\n4.局部晚期和/或转移性乳腺癌，经AI联合哌柏西利或瑞波西利（作为转移性疾病的首个激素治疗方案）治疗后有影像学或临床进展证据；在开始研究治疗前，受试者应停用任何CDKi至少14天；受试者可接受激素辅助治疗；既往最多接受2线针对转移性疾病的内分泌治疗；不允许既往接受过CDK4/6抑制剂辅助治疗；\n5.AI联合CDKi治疗晚期乳腺癌后，至少6个月内无证据显示进展；\n6.在血液或乳腺癌组织获得的细胞游离ctDNA中的ESR1配体结合域中检测出1个或多个ESR1点突变； \n7.具有可测量（根据 RECIST 1.1）或不可测量病灶的局部晚期或转移性乳腺癌；\n8.入组前，允许接受过1种用于治疗转移性疾病的细胞毒性化疗方案，末次化疗给药和入组研究之间需要至少14天的洗脱期；\n9.美国东部肿瘤协作组（ECOG）活动状态评分为0或1。\n排除标准：1.累及肺的癌性淋巴管炎；\n2.既往治疗期间有3级或4级间质性肺疾病（ILD）病史；\n3.经研究者评估存在需要进行细胞毒性化疗的内脏危象；\n4.既往接受阿贝西利、氟维司群或其他选择性雌激素受体降解剂（SERD）治疗期间发生疾病进展；\n5.已知对氟维司群或任何辅料有超敏反应的受试者；\n6.有长QTc（按心率校正的QT间期）综合征或QTc>480 msec病史；\n7.有肺栓塞（PE）、深静脉血栓（DVT）或任何已知的血栓形成倾向病史；\n8.拉索昔芬不建议用于存在增加静脉血栓栓塞症（VTE）风险的疾病的患者（例如重度充血性心力衰竭[CHF]或长期无法活动)。\n",

    "status": "招募状态待 CRC 核实",
    "sourceText": "16.RX0084-黄隽\nAK112联合注射用紫杉醇（白蛋白结合型）对比安慰剂联合注射用紫杉醇一线治疗PD-L1阴性的局部晚期不可切除或转移性三阴性乳腺癌的III期临床研究\nAK112（通用名：依沃西单抗，Ivonescimab）是一种全球首创（First-in-class）的PD-1/VEGF双特异性抗体\n联系人：王成联系方式：180****2678 \n目标患者：局部晚期不可切除或转移性的三阴乳腺癌受试者\n入选标准：1.具有组织学证实的不能行根治性治疗的局部晚期或转移性TNBC（人表皮生长因子2 [HER2]、雌激素受体[ER]和孕激素受体[PR]阴性）的受试者；\n2.适合紫杉烷类单药治疗；\n3.受试者既往未接受过系统性抗肿瘤治疗，为不适合接受根治性手术切除或局部治疗的局部晚期或转移性的TNBC患者，或经过手术切除或局部治疗后疾病进展的局部晚期或转移性的TNBC患者注：对于以下患者：1）既往接受过紫杉烷类新辅助或辅助治疗的受试者，在首次用药前，新辅助/辅助紫杉烷类治疗结束时间至出现复发或转移时间间隔≥12个月的患者；2）既往接受卡培他滨等化疗新辅助/辅助治疗结束时间至出现复发/转移时间间隔≥6个月的患者；可参加本研究。3）既往接受过PD-1/L1抑制剂新辅助/辅助治疗的受试者，在首次用药前，新辅助/辅助PD-1/L1抑制剂治疗结束时间至出现复发或转移时间间隔≥12个月的患者；4.入组前经中心实验室检测的肿瘤组织PD-L1表达阴性（PD-L1联合阳性评分 CPS<10）；\n5.良好的器官功能；\n排除标准：1.除TNBC以外，受试者在入组前5年内患有其他恶性肿瘤；\n2.首次给药前2周内针对非靶病灶进行了姑息性局部治疗；首次给药前2周内接受过非特异性免疫调节治疗（如白介素、干扰素、胸腺肽、肿瘤坏死因子等，不包括用于治疗血小板减少的IL-11）；首次给药前1周内曾接受具有抗肿瘤适应症的中草药或中成药；\n3.既往接受过除 PD-1/PD-L1 抑制剂外的其他免疫治疗；\n4.对于既往使用过 PD-1/L1 抑制剂的受试者：\na.既往出现过免疫治疗导致的 3 级及以上 irAE（不包括内分泌系统相关 irAE）、导致永久停止治疗的 irAE，2 级免疫相关性心脏毒 性或任何级别的神经或眼部 irAE； \nb. 在本研究筛选之前，使用前期免疫治疗时的所有不良事件尚未完全缓解或未缓解至 1 级。对于内分泌不良事件≥2 级的受试者，如果在适当的替代治疗中病情稳定，且无症状，则允许入组；c. 既往出现过需要使用除糖皮质激素以外的其他免疫抑制剂治疗的不良事件，或者在前期免疫治疗时出现不良事件复发，需要再次系统性使用糖皮质激素治疗；\n5.患有在过去两年内需要系统性治疗的活动性自身免疫性疾病（如使用改善病情药物、皮质类固醇、免疫抑制剂治疗）。替代治疗（如甲状腺素、胰岛素、或针对肾上腺或垂体功能不全的生理性皮质类固醇替代治疗）不认为是一种系统性治疗；\n6.存在免疫缺陷病史；HIV 抗体检测阳性者；当前正在长期使用系统性皮质类固醇激素或其他免疫抑制剂；\n7.已知存在活动性肺结核（TB），怀疑有活动性 TB 的受试者，需进行临床检查排除；已知的活动性梅毒感染；\n8.既往或当前存在需要系统性糖皮质激素治疗的非感染性肺炎/间质性肺疾病；\n9.当前存在活动性乙型肝炎受试者（HBsAg阳性且HBV-DNA超过1000拷贝/ml（200 IU/ml）或高于检测下限，以高者为准），对于患有乙型肝炎的受试者，要求在研究治疗期间接受抗乙肝病毒治疗；活动性的丙型肝炎受试者（HCV抗体阳性且HCV-RNA水平高于检测下限）；\n10.存在脑干、脑膜转移、脊髓转移或压迫；\n11.存在活动性中枢神经系统（CNS）转移病灶。注：先前治疗过的脑转移的受试者（如手术、放疗），如果治疗后临床稳定至少四周（至首次给予研究药物），且研究药物给药前 3 天停用皮质类固醇激素，则允许入组；未经治疗的、无症状的脑转移受试者(即无神经系统症状，不需要皮质类固醇激素，没有任何脑转移灶的长径>1.5 cm，无明显脑转移灶周围水肿)可以入组；\n12.肿瘤侵犯或压迫周围重要血管及脏器（如主动脉、心脏及心包、上腔静脉、气管、食管等）；肿瘤纵隔淋巴结转移侵犯气管、主支气管或存在发生食管气管瘘或食管胸膜瘘风险；\n13.有严重出血倾向或凝血功能障碍病史；既往治疗：\n1）既往接受过紫杉烷类新辅助或辅助治疗的受试者，在首次用药前，新辅助/辅助紫杉烷类治疗结束时间至出现复发或转移时间间隔≥12个月的患者；\n2）既往接受卡培他滨等化疗新辅助/辅助治疗结束时间至出现复发/转移时间间隔≥6个月的患者；可参加本研究；\n3）既往接受过PD-1/L1抑制剂新辅助/辅助治疗的受试者，在首次用药前，新辅助/辅助PD-1/L1抑制剂治疗结束时间至出现复发或转移时间间隔≥12个月的患者。\n",

    "sourceText": "19.RX0093-黄隽\n一项比较IBI354联合或不联合帕妥珠单抗对比紫杉烷联合曲妥珠单抗和帕妥珠单抗一线治疗不可切除局部晚期或转移性HER2阳性乳腺癌参与者的随机、多中心、开放性Ⅲ期研究\n联系人：刘兰 177****5406        霍梦慧 184****5891\nIBI354是一种新型的、靶向HER2的抗体药物偶联物（ADC）\n目标患者：不可切除局部晚期或转移性乳腺癌，根据中心实验室检测确诊为HER2阳性(HER2 IHC 3+或HER2 ISH+)\n参加条件：1. 年龄大于等于18周岁。2. 病理学确认的乳腺癌：\n（1）不可切除局部晚期或转移性乳腺癌，根据中心实验室检测确诊为HER2阳性(HER2 IHC 3+或HER2 ISH+)；（2）在疾病转移情况下经当地检测后有病史记录激素受体和/或孕激素受体结果。\n3. 既往未接受过针对不可切除局部晚期或转移性乳腺癌的化疗或HER2靶向治疗（对于转移性乳腺癌患者，允许接受过一线内分泌治疗）。在新辅助或辅助治疗中接受过化疗或HER2靶向治疗且从完成全身化疗或HER2靶向治疗至疾病进展>6个月的参与者有资格入组；\n4. 既往未接受过包含喜树碱或其衍生物的抗体偶联药物治疗。\n",

    "title": "评估 TQB2930 联合研究者选择的化疗对比曲妥珠单抗联合研究者选择的化疗治疗 HER2 阳性晚期乳腺癌的随机、开放、平行对照、多中心 III 期临床研究（TQB2930-III-01）",
    "status": "招募状态待 CRC 核实",
    "sourceText": "21.RX0085-王守满 黄隽\n评估 TQB2930 联合研究者选择的化疗对比曲妥珠单抗联合研究者选择的化疗治疗 HER2 阳性晚期乳腺癌的随机、开放、平行对照、多中心 III 期临床研究（TQB2930-III-01）\n联系人：雷宜晨 155****5115\nTQB2930是一种靶向HER2的双特异性抗体（曲妥珠单抗和帕妥珠单抗）\n目标患者： 晚期阶段接受过至少2线抗HER2治疗的HER2阳性晚期乳腺癌\n入选标准：(1) 受试者自愿加入本研究，签署知情同意书； \n(2) 年龄：[18-75]周岁（签署知情同意书时）；ECOG 评分：≤1 分；预计生存期 超过 3 个月； \n(3) 经细胞学/组织病理学证实的 HER2 阳性复发或转移性乳腺癌；HER2 阳性定义为：标准免疫组化（IHC）检测为 3+，或原位杂交[ISH]阳性；若 IHC 检测显示为 2+，须进行 ISH 确认是阳性； \n(4) 晚期阶段既往接受过≥2 线抗 HER2 靶向治疗，末次治疗过程中或治疗结束后出现疾病进展或不耐受。需包括曲妥珠单抗或曲妥珠单抗生物类似药或伊尼妥单抗，其他抗 HER2 靶向治疗如帕妥珠单抗或帕妥珠单抗生物类似药、德曲妥珠单抗、吡咯替尼、拉帕替尼、T-DM1、图卡替尼等，末次治疗不应包含帕妥珠单抗； \n(5) 至少有一个除脑部病灶外符合 RECIST 1.1 标准的可测量病灶； \n(6) 可接受研究者选择化疗方案（艾立布林、卡培他滨、吉西他滨、长春瑞滨）中的一种；\n(7) 主要器官功能良好，符合下列标准： \n1) 血常规检查标准（检查前 7 天内未输血、未使用造血刺激因子类药物纠正）： \n血红蛋白（HGB）≥ 90g/L； \n中性粒细胞绝对值（NEUT）≥1.5 ×109 /L； \n血小板计数（PLT）≥ 90×109 /L。 \n2) 生化检查需符合以下标准： \n总胆红素（TBIL）≤ 1.5 倍正常值上限（ULN）； \n丙氨酸基转移酶（ALT）和天门冬氨酸基转移酶（AST）≤ 2.5×ULN。若伴肝转移，则 ALT 和 AST≤ 5×ULN； \n血清肌酐（Cr）≤ 1.5×ULN 或肌酐清除率（CCr）≥ 60 ml/min （应用标准的 Cockcroft-Gault 公式）。 \n3) 凝血功能检查需符合以下标准： \n国际标准化比值（INR）≤ 1.5×ULN（既往 2 周内未接受过抗凝治疗）； \n4) 心脏彩超评估 ：左室射血分数（LVEF）≥50%。 \n(8) 育龄女性受试者应同意在研究期间和研究结束后 6 个月内必须采用避孕措施（如宫内节育器、避孕药或避孕套）；在研究入组前的 7 天内血清妊娠试验阴性，且必须为非哺乳期受试者；男性受试者应同意在研究期间和研究期结束后 6 个月内必须采用避育措施。\n排除标准：(1) 合并疾病及病史： \n1) 随机前 5 年内出现过或当前同时患有其它恶性肿瘤。以下情况可以入组：治愈的子宫颈原位癌、非黑色素瘤的皮肤癌和表浅的膀胱肿瘤 [Ta（非 浸润性肿瘤），Tis（原位癌）和 T1（肿瘤浸润基膜）]； \n2) 由于任何既往治疗引起的高于 CTC AE 1 级以上的无法控制的毒性反应 （脱发除外）； \n3) 随机前 28 天内接受了重大外科治疗、切开活检或明显创伤性损伤； \n4) 长期未愈合的伤口或骨折；\n5) 随机前 6 个月内发生过动/静脉血栓事件，如脑血管意外（包括暂时性缺血性发作、脑出血、脑梗塞）、深静脉血栓及肺栓塞等； \n6) 具有精神类药物滥用史且无法戒除或有精神障碍者； \n7) 血压控制不理想（收缩压≥150mmHg 或舒张压≥100 mmHg）； \n8) 患有≥2 级心肌缺血或心肌梗塞、心律失常（包括 QTc ≥450ms（男）， QTc ≥470ms（女））及≥2 级充血性心功能衰竭（纽约心脏病协会 （NYHA）分级）； \n9) 活动性或未能控制的严重感染（≥CTC AE 2 级感染）； \n10) 有已知的乙型肝炎病史（定义为乙型肝炎表面抗原[HBsAg]阳性且检测到 HBV-DNA）或已知的活动性丙型肝炎病毒感染（定义为可检测到 HCVRNA[定性]且 HCV 抗体阳性）； \n11) 已知活动性梅毒者； \n12) 肾功能衰竭需要血液透析或腹膜透析者； \n13) 有免疫缺陷病史，包括 HIV 阳性或患有其它获得性、先天性免疫缺陷疾病，或有器官移植史者； \n14) 糖尿病控制不佳（空腹血糖（FBG）＞10 mmol/L）； \n15) 尿常规提示尿蛋白≥ ++，且证实 24 小时尿蛋白定量＞1.0 g 者； \n16) 患有癫痫并需要治疗者。 \n(2) 肿瘤相关症状及治疗： \n1) 随机前 4 周内曾接受过化疗、放疗或免疫治疗等其他抗肿瘤药物治疗，或仍处于药物的 5 个半衰期内的受试者（以最短出现的时间为准）；既往曾接受过局部放疗的，如果满足以下条件可以入组：放疗结束距研究治疗开始超过 4 周（脑部放疗为超过 2 周）；且本次研究选择的靶病灶不在放疗区域内；或靶病灶位于放疗区域内，但已确认进展； \n2) 随机前 2 周内接受过 NMPA 批准药物说明书中明确具有抗肿瘤适应症的中成药（包括复方斑蝥胶囊、康艾注射液、康莱特胶囊/注射剂、艾迪注射液、鸦胆子油注射剂/胶囊、消癌平片/注射剂、华蟾素胶囊等）治疗； \n3) 肿瘤骨转移所导致的严重骨损伤，包括 6 个月内发生的或预计近期很可能发生的重要部位病理性骨折和脊髓压迫等；\n4) 存在未经治疗的脑转移或有脑膜转移或有癌性脑膜炎的受试者（既往经过治疗稳定无症状的脑转移除外）；\n5) 既往接受 HER2 靶向治疗的过程中出现 LVEF 下降至<50%或者 LVEF 绝对值降低>15%； \n6) 未控制的高钙血症或症状性高钙血症需要持续接受双膦酸盐治疗； \n7) 未控制的癌性疼痛； \n8) 存在癌性淋巴管炎，或无法通过引流控制的第三间隙积液（如大量腹水、胸腔积液、心包积液）； \n9) 随机前 2 周内使用过免疫抑制剂或全身激素治疗以达到免疫抑制目的（剂量>10mg/d 泼尼松或同等剂量的其他皮质类固醇激素），不包括鼻喷或吸入性皮质类固醇激素。 \n(3) 研究治疗相关：使用单克隆抗体后出现过重度超敏反应者； \n(4) 随机前 4 周内参加且使用过其他抗肿瘤临床试验药物者； \n(5) 经研究者的判断，存在严重危害受试者安全或影响受试者完成研究的情\n",

    "sourceText": "28、RX0102—黄隽\n一项评估BGB-43395(cdk4) 联合来曲唑与CDK4/6 抑制剂（阿贝西利、哌柏西利、瑞波西利）联合来曲唑治疗既往未因晚期或转移性疾病接受过全身性抗肿瘤治疗的晚期或转移性HR+/HER2-乳腺癌患者的有效性和安全性的开放性、随机、多中心、3 期研究\n联系人：宋乐  183****7753\n组别：A组（试验组）：BGB-43395（剂量为400 mg，每日两次，随餐口服给药，日总剂量800 mg）与来曲唑联合给药，每28 天为1 个周期。来曲唑剂量为2.5 mg，每日一次，随餐或空腹口服给药，每28 天为1 个周期。\nB 组（对照组）：根据研究者的选择，患者将接受三种已批准的CDK4/6 抑制剂中的任一一种：阿贝西利、哌柏西利或瑞波西利与来曲唑联合用药。CDK4/6 抑制剂的给药方案如下：阿贝西利剂量为150 mg（每日总剂量为300 mg），每日两次，口服给药，每28 天为1 个周期。\n瑞波西利剂量为600 mg，每日一次，随餐或空腹口服给药，连续给药21 天，随后停药7 天，每28 天为1 个周期。\n哌柏西利剂量为125 mg，每日一次，随餐或空腹口服给药，连续给药21 天，随后停药7天，每28 天为1 个周期。来曲唑剂量为2.5 mg，每日一次，随餐或空腹口服给药，每28 天为1 个周期。\n目标患者： 随机化入组本研究的患者年龄≥ 18 岁或达到研究所在地区的法定同意年龄，经组织学证实的既往未因晚期或转移性疾病接受过全身性治疗的晚期或转移性HR+/HER2-BC 患者。\n主要入选标准\n1.签署知情同意书时，患者的年龄必须至少年满18 岁或达到研究所在地区的法定同意年龄；\n2.经组织学证实的局部晚期或转移性HR+HER2-BC 患者（基于ASCO/CAP 指南）。ER 阳性定义为≥ 1%ER 阳性和/或PR 阳性染色细胞，通过符合当地标准的检测方法评估。根据ASCO/CAP 指南，应通过免疫组织化（IHC）或原位杂交记录HER2 阴性；\n3.患者必须能够提供存档FFPE 肿瘤组织样本（组织块或新切的未染色FFPE 组织切片）。如果不能提供存档组织，则必须采集新鲜的肿瘤活检样本；\n4.患者必须有符合RECIST 1.1 版定义的可测量病灶。仅存在骨病灶的患者，只要经BICR（盲态独立中心审查）确认存在可评估骨病灶，即至少1 处溶骨性或混合性溶骨-成骨性骨病灶（仅成骨性转移患者不具备入组资格）即可入组。以上仅为部分入选标准，如您有兴趣了解关于本研究或研究药物的详情，可以咨询研究医生。研究医生将根据具体情况来判断您是否可以参加此项研究。\n部分排除标准\n1.既往因晚期或转移性疾病接受过全身性治疗的患者；\n2.既往在（新）辅助治疗中接受过基于内分泌的治疗（伴或不伴CDK4/6 抑制剂），并在内分泌治疗期间或末次内分泌治疗后12 个月内出现疾病复发的患者。\n3.既往在任何疾病背景下接受过任何选择性CDK4 或CDK2 靶向药物或任何其他试验性抗肿瘤药物治疗的患者，除辅助治疗背景下既往使用过试验用或已获批的SERD 外，前提是疾病复发发生距离最后一次内分泌治疗给药后超过12 个月。\n4.出现内脏危象的患者，定义为需细胞毒治疗和/或快速疾病进展伴即将发生内脏损害的患者。\n\n\n",

 if(['RX0093','RX0073','RX0085','RX0088'].includes(p.id))add('HER2 分型',p.id==='RX0073'&&!pos?'未知':x.her2,p.id==='RX0073'?'HER2 过表达、扩增或突变；阴性IHC不能排除HER2突变':'HER2 阳性','目标患者 / 入选标准',pos);
 if(p.id==='RX0098')add('HER2 分型',x.her2,'B 部分：HER2 阴性乳腺癌','入选标准 9',neg);
 if(['RX0098','RX0099','RX0086','RX0073','RX0085','RX0088','RX0067','RX0078'].includes(p.id))add('年龄',x.age,'18–75 岁（含两端）','入选标准',+x.age>=18&&+x.age<=75);

 if(['RX0099','RX0086','RX0073','RX0088','RX0067','RX0078'].includes(p.id))add('性别',x.sex,'女性','入选标准',x.sex==='女');
 if(['RX0098','RX0099','RX0077','RX0070','RX0086','RX0073','RX0085','RX0088','RX0067','RX0078'].includes(p.id))add('ECOG',x.ecog,'0–1 分','入选标准',+x.ecog<=1);
 if(['RX0074','RX0084','RX0086','RX0067','RX0078','RX0089','RX0102'].includes(p.id))add('晚期是否未经系统治疗',x.advanced,'是'+(p.id==='RX0067'?'；仅演示文档当前开放的 HRS-8080 队列':''),'目标患者 / 开放队列',x.advanced==='是');
 if(p.id==='RX0093')add('晚期化疗线数',x.chemo,'0 线；另需人工核实未用抗 HER2 治疗','入选标准 3',+x.chemo===0);

 if(['RX0077','RX0101','RX0070'].includes(p.id))add('CDK4/6i 联合内分泌进展',x.cdk,'是','入选标准',x.cdk==='是');
 if(['RX0101','RX0070'].includes(p.id))add('晚期化疗线数',x.chemo,'≤1 线','入选标准',+x.chemo<=1);
 if(p.id==='RX0075')add('晚期化疗线数',x.chemo,'1–2 线且治疗失败，失败情况另复核','入选标准 2',+x.chemo>=1&&+x.chemo<=2);
 if(p.id==='RX0098'){add('既往化疗（B 部分）',x.chemo,'无禁忌时至少1次，例外由研究者评估','入选标准 9',+x.chemo>=1);add('HRR 基因（完整范围）','未知','包括 BRCA1/2、PALB2、RAD51C/D、ATM；非携带者也有人工评估例外','入选标准 3',false)}
 if(p.id==='RX0074')add('BRCA1/2 或 PALB2 突变',x.brca,'功能丧失性突变，检测资质另复核','入选标准 3',x.brca==='阳性');

 if(['RX0099','RX0075','RX0084','RX0086','RX0093'].includes(p.id))add('中心实验室结果',x.central,'中心实验室确认；院内结果不可替代','入选标准',x.central==='已确认');
 if(p.id==='RX0101'){if(x.sex==='女')add('绝经状态',x.menopause,'绝经后','入选标准 1',x.menopause==='是');add('既往氟维司群（联合该药队列）',x.fulv,'未使用；其他队列另核实','排除标准 2',x.fulv==='否')}

 if(['RX0085','RX0088','RX0073'].includes(p.id))add('既往抗 HER2 治疗等完整病史','未知','需按项目核对线数、药物及治疗阶段','完整纳排原文',false);

function screening(){return `<button class="quiet" data-action="home">← 返回患者列表</button><div class="heading"><div><h1>核对患者筛选资料</h1><div class="muted">演示患者 A · 所有输入仅保留在当前浏览器演示内</div></div><span class="pill">虚构病例</span></div><form id="screen-form" data-review-anchor="screen-form"><div class="card"><h3 class="sectionhead">基础信息与病理</h3><div class="formgrid">${field('age','年龄（岁）')}${field('sex','性别',['女','男','未知'])}${field('hr','激素受体 HR',['阳性','阴性','未知'])}${field('her2','HER2 IHC',['0','1+','2+','3+','未知'])}${field('ish','HER2 ISH',['阴性','阳性','未知'])}${field('ecog','ECOG（分）')}${field('central','相关中心实验室结果',['待核验','已确认','不符合'])}${field('menopause','是否绝经后',['是','否','未知'])}${field('biopsy','最近病理日期')}</div><p class="muted">院内与中心实验室结果分别核验。“近一个月穿刺”尚未明确对应项目，本 Demo 不将其设为所有项目的通用门槛。</p></div><div class="card"><h3 class="sectionhead">既往治疗与生物标志物</h3><div class="formgrid">${field('advanced','晚期是否未经系统治疗',['是','否','未知'])}${field('et','晚期内分泌线数')}${field('chemo','晚期化疗线数')}${field('cdk','CDK4/6i 联合内分泌后进展',['是','否','未知'])}${field('brca','BRCA1/2 或 PALB2 突变',['阳性','阴性','未知'])}${field('esr1','ESR1 突变',['阳性','阴性','未知'])}${field('pik3ca','PIK3CA 突变',['阳性','阴性','未知'])}${field('cps','PD-L1 CPS')}${field('slices','可用组织切片（片）')}</div></div><div class="card"><h3 class="sectionhead">需重点核查的病史</h3><div class="formgrid">${field('cns','是否 CNS 转移',['否','是','未知'])}${field('ild','ILD / 非感染性肺炎病史或现症',['否','是','未知'])}${field('fulv','既往是否用过氟维司群',['否','是','未知'])}</div><div class="note warning">这里只演示关键条款筛选。研究者判断、洗脱期、器官功能、例外情形及未录入条款，均需回到项目原文逐条审核。</div></div>${state.error?`<div role="alert" class="note danger">${esc(state.error)}</div>`:''}<div class="bar"><button type="button" data-action="home">取消</button><button class="primary" type="button" data-action="run-screen">运行初筛 · 17 个项目</button></div></form>`}

function results(){const candidates=state.results.filter(r=>r.status==='candidate'),excluded=state.results.filter(r=>r.status==='excluded'||r.status==='manual'),closed=state.results.filter(r=>r.status==='closed');return `<button class="quiet" data-action="screen">← 修改筛选资料</button><div class="heading"><div><h1>初筛候选项目 <span class="pillcount">${candidates.length}</span></h1><div class="muted">演示患者 A · 关键条款核对结果 · 非入组结论</div></div><span class="pill blue">初筛完成（模拟）</span></div><div class="note" data-review-anchor="result-summary">17 个项目 → ${candidates.length} 个待进一步核查候选；${excluded.length} 个不符或需额外人工分流，${closed.length} 个暂停 / 未招募。<br>按原文顺序呈现，不代表疗效或指南优先级。资料未知不会自动判为符合。</div>${candidates.length?candidates.map(resultCard).join(''):`<div class="card empty" data-review-anchor="no-candidates"><div class="glyph">⌕</div><h2>本次没有候选项目</h2><p>查看不符原因，或补充、更正患者资料后重新筛选。</p><button data-action="screen">返回核对资料</button></div>`}<details class="card" data-review-anchor="excluded-list"><summary>查看未列入候选的 ${excluded.length+closed.length} 个项目</summary>${[...excluded,...closed].map(r=>`<div class="project-actions"><div><b>${r.project.id}</b>　${esc(r.project.name)}<div class="muted">${r.status==='closed'?esc(r.project.status):r.status==='manual'?'HER2通路异常资料不足，保留人工分流；不判定排除。':esc(r.failures.map(q=>q.label+'：'+q.actual+'；要求 '+q.expected).join(' / '))}</div></div><button data-action="detail" data-id="${r.project.id}">依据</button></div>`).join('')}</details><div class="sticky-action"><div><b>已选 ${state.selected.size} 个项目</b><div class="muted">推送前需医生核对，CRC 接续细审。</div></div><button class="primary" data-action="push-open" ${!state.selected.size?'disabled':''}>核对并推送 CRC →</button></div>`}
function library(){let ps=PROJECTS.filter(p=>(state.group==='全部'||p.group===state.group)&&(p.id+p.name+p.title+p.target).toLowerCase().includes(state.search.toLowerCase()));return `<div class="heading"><div><h1>团队临床项目库</h1><div class="muted">17 个项目 · 2026.09.22 团队资料快照</div></div><span class="pill">全部已嵌入</span></div><div class="filterbar"><label style="flex:1"><span class="sr-only">搜索项目</span><input class="search" id="project-search" placeholder="搜索项目编号、药物或人群" value="${esc(state.search)}"></label><select id="group-filter" aria-label="项目分型">${['全部','HR+ / HER2−','三阴性乳腺癌','HER2 阳性 / 通路异常'].map(g=>`<option ${g===state.group?'selected':''}>${g}</option>`).join('')}</select></div><div class="statusline">找到 ${ps.length} 个项目 · 指南优先级待配置</div><div class="compact-list">${ps.map(p=>`<article class="card" data-review-anchor="library-${p.id}"><div class="row between"><span class="pill blue">${p.id}</span>${statusBadge(p)}</div><h3 style="margin-top:12px">${esc(p.name)}</h3><div class="muted">${esc(p.target)}</div><div class="project-actions"><span class="muted">${esc(p.group)}</span><button data-action="detail" data-id="${p.id}">查看详情</button></div></article>`).join('')}</div>${!ps.length?'<div class="card empty"><h2>没有匹配的项目</h2><button data-action="clear-search">清除筛选</button></div>':''}<p class="muted">“33 个在研项目”为需求背景数量；当前来源文档包含 17 个独立项目，未补造其他项目。</p>`}
function detail(){let p=PROJECTS.find(p=>p.id===state.current),r=state.results.find(r=>r.project.id===p.id);return `<button class="quiet" data-action="back-detail">← 返回${state.detailFrom==='results'?'初筛结果':'项目库'}</button><div class="row between"><span class="pill blue">${p.id}</span>${statusBadge(p)}</div><h1 style="font-size:23px;margin-top:14px">${esc(p.name)}</h1><p class="muted">${esc(p.title)}</p><div class="card"><h3>试验方向与联系</h3><p>${esc(p.target)}</p><p class="muted">${esc(p.contact)}</p><div class="note">指南优先级：待配置。联系方式已脱敏，可通过原始项目文档查看。Demo 不拨号、不发送真实消息。</div>${p.id==='RX0067'?'<div class="note warning">原文标注“只入 HRS-8080 实验组”。其他队列仅保留原文供核查，不按开放队列推荐。</div>':''}</div>${r?`<div class="card" data-review-anchor="rule-table"><h3>与当前模拟患者逐条核对</h3><table class="rules"><thead><tr><th>条款 / 来源</th><th>当前资料</th><th>项目要求</th><th>状态</th></tr></thead><tbody>${r.rules.map(q=>`<tr><td><b>${esc(q.label)}</b><br><span class="muted">${esc(q.source)}</span></td><td>${esc(q.actual)}</td><td>${esc(q.expected)}</td><td><span class="pill ${q.status==='pass'?'green':q.status==='fail'?'red':'amber'}">${q.status==='pass'?'关键项符合':q.status==='fail'?'不符 / 需复核':'待核验'}</span></td></tr>`).join('')}</tbody></table><div class="note warning">未展示为自动核对项的完整条款，仍需 CRC / 研究者逐项核查。存在例外时以人工审核为准；不生成“符合全部条件”结论。</div></div>`:''}<div class="card" data-review-anchor="original-criteria"><div class="row between"><h3>项目纳排及方案原文</h3><a href="${SOURCE}" target="_blank" rel="noopener">来源文档 ↗</a></div><div class="original">${esc(p.sourceText)}</div></div><button data-action="back-detail">返回${state.detailFrom==='results'?'初筛结果':'项目库'}</button>`}
const steps=[['患者授权并绑定接诊医生','患者端','演示前置条件：已授权关联。'],['患者上传病历资料','患者端','演示前置条件：已提供虚构病理与治疗记录。'],['AI 匹配，初筛医生推送 CRC','初筛医生','候选线索经医生核对后推送。'],['CRC 审核是否拟入组','CRC / CRA / 申办方','给出拟入组意见；不纳入须记录原因并终止。'],['PI 主导签署知情同意书','PI 研究者','未签署不得进入入组前检查环节。'],['PI 确认签署，CRC 安排检查','PI → CRC','按研究方案完成检验、影像及基线评估。'],['审核检查结果，推荐或剔除','CRC / CRA / 申办方','不符合则剔除并记录原因；符合则推荐至 PI。'],['PI 最终判定是否入组','PI 研究者','最终入组决定由 PI 作出。'],['正式入组，进入随访管理','黄隽主任全览','本 Demo 仅展示后续进度，不开放代签或审批操作。']];
function progress(){return `<div class="heading"><div><h1>患者项目进度</h1><div class="muted">初筛推送与后续环节 · 模拟记录</div></div><button data-action="home">返回工作台</button></div>${!state.records.length?'<div class="card empty"><div class="glyph">▤</div><h2>还没有推送记录</h2><p>完成初筛并确认推送后，这里显示项目进度。</p><button class="primary" data-action="screen">去初筛</button></div>':state.records.map((r,i)=>`<div class="card" data-review-anchor="record-${i}"><div class="row between"><b>${r.id} · 演示患者 A</b><span class="pill blue">${r.followup?'入组前检查中（模拟）':'待 CRC 细审（模拟）'}</span></div><p>${r.ids.map(id=>id+' '+esc(PROJECTS.find(p=>p.id===id).name)).join('<br>')}</p><div class="muted">${esc(r.note)}</div><div class="note">模拟推送已记录。未发送患者资料或任何真实通知。</div></div>`).join('')}<div class="card" data-review-anchor="progress-timeline"><h3>全流程 · 角色与责任</h3><div class="timeline">${steps.map((s,i)=>{let at=typeof preparation!=='undefined'&&!preparation.kind?1:state.records.length?(state.records.some(r=>r.followup)?5:3):2;return `<div class="step ${i<at?'done':i===at?'current':''}"><span class="dot">${i<at?'✓':i+1}</span><div><h3>${s[0]}</h3><span class="pill">${s[1]}</span><p class="muted">${s[2]}</p></div></div>`}).join('')}</div><a href="${FLOW}" target="_blank" rel="noopener">查看流程依据 ↗</a></div>`}
function pushModal(){const ps=PROJECTS.filter(p=>state.selected.has(p.id)),missing=ps.some(p=>p.contact==='文档未提供 CRC 联系人');return `<div class="modal-wrap" data-review-anchor="push-dialog"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="push-title"><h2 id="push-title">核对推送给 CRC 的信息</h2><p class="muted">演示患者 A · 已选择 ${ps.length} 个候选项目</p>${ps.map(p=>`<div class="project-actions"><div><b>${p.id} · ${esc(p.name)}</b><div class="muted">${esc(p.contact)}</div></div></div>`).join('')}<div class="note warning">所有候选仍需核实完整纳排与招募状态。此次推送仅为模拟，不产生真实消息。</div><label class="field">给 CRC 的备注<textarea id="push-note">${esc(state.note)}</textarea></label><label class="selectline" style="margin-top:15px;font-size:12px"><input type="checkbox" id="review-confirm">我已核对候选及待核验项（演示）</label>${missing?'<div class="note danger">所选项目存在 CRC 联系人缺失，请返回取消该项目或先核实联系人。</div>':''}${state.error?`<div class="note danger" role="alert">${esc(state.error)}</div>`:''}<div class="bar"><button data-action="push-cancel">取消</button><button class="primary" data-action="push-confirm" ${missing||state.busy?'disabled':''}>${state.busy?'正在模拟推送…':state.error?'重试模拟推送':'确认模拟推送'}</button></div></section></div>`}
const SCENES=[['home','01 工作台'],['screen','02 核对患者资料'],['results','03 初筛候选与依据'],['library','04 项目库 · 17 项'],['progress','05 推送与进度']];
const BOUNDARIES=[['missing','B1 关键资料缺失'],['center','B2 中心结果不符合'],['none','B3 无候选项目'],['push-fail','B4 推送失败与重试'],['followup','B5 后续进度展示']];

function render(){const p=state.page,g=GUIDES[p]||GUIDES.home;$('#app').innerHTML=`<header class="reviewbar"><div><strong>临床项目患者管理 · 医生 Demo</strong>　<span>V0.1 / 新增设计 / 模拟数据</span></div><div class="row"><button data-action="coverage">全部功能说明</button><button data-action="reset">恢复初始</button></div></header><div class="layout"><nav class="scenarios" aria-label="演示场景"><div class="label">功能页面</div>${SCENES.map(([id,t])=>`<button data-scene="${id}" class="${state.scenario===id?'active':''}">${t}</button>`).join('')}<details open><summary>边界与异常 · 05</summary>${BOUNDARIES.map(([id,t])=>`<button data-scene="${id}" class="${state.scenario===id?'active':''}">${t}</button>`).join('')}</details><small>场景按钮设置虚构演示初态。<br>切换保留推送记录，恢复初始清空模拟状态。<br><br>按项目文档核对关键条款，完整审核交由人工。</small></nav><main class="product" data-review-scene="${esc(state.scenario)}"><div class="brandbar"><div class="brand"><span class="brandmark">＋</span>临床研究工作台</div><div class="team">黄隽教授团队　<span class="pill blue">初筛医生</span></div></div><nav class="productnav" aria-label="产品导航"><button data-action="home" class="${['home','screen','results','detail'].includes(p)?'on':''}">患者初筛</button><button data-action="library" class="${p==='library'?'on':''}">项目库</button><button data-action="progress" class="${p==='progress'?'on':''}">项目进度</button></nav><div class="content" data-review-anchor="page-content">${p==='home'?overview():p==='screen'?screening():p==='results'?results():p==='library'?library():p==='detail'?detail():p==='progress'?progress():coverage()}</div><div class="footer-note">仅用于产品演示 · 虚构患者 · AI不作最终入组判定</div>${state.modal?pushModal():''}</main><aside class="guide" data-review-anchor="current-guide"><div class="kicker">当前页面说明 · REVIEW GUIDE</div><h2>${state.modal?'推送核对弹窗':g[0]}</h2><h3>页面与调整说明</h3><p>${g[1]}</p><h3>功能操作与预期结果</h3><ol>${(state.modal?['核对清单、修改备注并勾选确认→ 才能模拟推送。','取消→ 清单和备注保留，不生成记录。','失败→ 备注不丢；重试成功后只增加一条记录。']:g[2]).map(v=>`<li>${v}</li>`).join('')}</ol><h3>关键验收点</h3><ul>${(state.modal?['未勾选核对时不生成推送。','重复推送相同患者及项目清单不新增重复记录。','确认只更新演示，不发送真实通知。']:g[3]).map(v=>`<li>${v}</li>`).join('')}</ul><div class="note">指南优先级：待配置<br>完整纳排审核：人工完成</div><div class="source-links"><a href="${SOURCE}" target="_blank" rel="noopener">项目资料 ↗</a> · <a href="${FLOW}" target="_blank" rel="noopener">流程依据 ↗</a></div></aside></div>`;bind();if(state.page!==previousPage||(state.modal&&!previousModal))window.scrollTo({top:0,behavior:'instant'});previousPage=state.page;previousModal=state.modal;}
function toast(s){document.querySelector('.toast')?.remove();let e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.textContent=s;document.body.appendChild(e);setTimeout(()=>e.remove(),3500)}
function navigate(p){state.page=p;state.modal=false;state.error='';if(['home','screen','results','library','progress'].includes(p))state.scenario=p;render()}
function scene(id){state.modal=false;state.error='';state.busy=false;state.fail=false;state.scenario=id;state.search='';state.group='全部';if(['home','screen','library','progress'].includes(id)){state.page=id;render();return}if(id==='followup'){if(!state.records.some(r=>r.id==='DEMO-FOLLOW'))state.records.push({id:'DEMO-FOLLOW',ids:['RX0077'],note:'后续进度样例，非真实审批记录。',followup:true});state.page='progress';render();return}state.patient={...initial};if(id==='missing'){state.patient.her2='未知';state.patient.ecog='';state.patient.et='';state.patient.chemo='';state.patient.central='待核验'}if(id==='center')state.patient.central='不符合';if(id==='none'){state.patient.age=80;state.patient.ecog=3;state.patient.hr='陰性'.replace('陰','阴');state.patient.her2='0';state.patient.advanced='否';state.patient.chemo=4;state.patient.cdk='否'}state.results=PROJECTS.map(evaluate);state.selected=new Set();state.page='results';if(id==='push-fail'){state.selected.add('RX0077');state.fail=true;state.modal=true;state.note='请核实组织切片与完整排除标准。'}render()}
function readForm(){const f=new FormData($('#screen-form'));for(const [k,v] of f)state.patient[k]=v;}
function submitScreen(){if(!$('#screen-form').reportValidity())return;readForm();if(state.patient.age!==''&&(+state.patient.age<0||!Number.isInteger(+state.patient.age))){state.error='年龄请填写非负整数，或留空作为待核验资料。';render();return}if(state.patient.advanced==='是'&&((state.patient.chemo!==''&&+state.patient.chemo>0)||(state.patient.et!==''&&+state.patient.et>0))){state.error='“晚期未经系统治疗”与已填写治疗线数冲突，请核对后再筛选。';render();return}state.scenario='results';run()}
function bind(){document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>scene(b.dataset.scene));document.querySelectorAll('[data-select]').forEach(b=>b.onchange=()=>{b.checked?state.selected.add(b.dataset.select):state.selected.delete(b.dataset.select);b.closest('.project-card')?.classList.toggle('selected',b.checked);const count=$('.sticky-action b');if(count)count.textContent='已选 '+state.selected.size+' 个项目';const push=$('[data-action="push-open"]');if(push)push.disabled=state.selected.size===0});$('#screen-form')?.addEventListener('submit',e=>{e.preventDefault();submitScreen()});$('#screen-form')?.addEventListener('change',readForm);$('#project-search')?.addEventListener('input',e=>{let pos=e.target.selectionStart;state.search=e.target.value;render();$('#project-search').focus();$('#project-search').setSelectionRange(pos,pos)});$('#group-filter')?.addEventListener('change',e=>{state.group=e.target.value;render()});$('#push-note')?.addEventListener('input',e=>state.note=e.target.value);document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action,b.dataset.id));}
function action(a,id){if(a==='run-screen'){submitScreen();return}if(['home','screen','library','progress','coverage'].includes(a)){navigate(a);return}if(a==='reset'){state={page:'home',scenario:'home',patient:{...initial},results:[],selected:new Set(),records:[],current:null,search:'',group:'全部',fail:false,error:'',modal:false,note:'请协助核实招募状态、完整纳排条件及中心实验室结果。',busy:false};render();toast('演示已恢复初始');return}if(a==='clear-search'){state.search='';state.group='全部';render();return}if(a==='detail'){state.detailFrom=state.page;state.current=id;state.page='detail';state.scenario='detail-'+id;render();return}if(a==='back-detail'){state.page=state.detailFrom||'library';state.scenario=state.page;render();return}if(a==='push-open'){if(!state.selected.size)return;state.modal=true;state.error='';state.scenario=state.fail?'push-fail':'push-dialog';render();$('#push-note')?.focus();return}if(a==='push-cancel'){state.modal=false;state.error='';state.scenario='results';render();return}if(a==='push-confirm'){if(state.busy)return;if(!$('#review-confirm').checked){state.error='请先勾选“我已核对候选及待核验项”。';render();return}if(state.fail){state.fail=false;state.error='模拟网络失败：未生成推送记录。已保留项目清单及备注，请勾选核对后重试。';render();return}const selected=[...state.selected].sort(),key=selected.join('|');if(state.records.some(r=>r.ids.slice().sort().join('|')===key)){state.modal=false;navigate('progress');toast('该患者的相同项目清单已推送，未重复创建');return}state.records.push({id:'DEMO-'+String(state.records.length+1).padStart(3,'0'),ids:selected,note:state.note,followup:false});state.modal=false;navigate('progress');toast('模拟推送已记录，待 CRC 细审');}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal)action('push-cancel')});
document.addEventListener('prototype-review:locate',e=>{const s=e.detail?.scene;if(!s)return;if(s.startsWith('detail-')&&ids.includes(s.slice(7))){state.results=PROJECTS.map(evaluate);state.current=s.slice(7);state.detailFrom='results';state.page='detail';state.scenario=s;state.modal=false;render();return}if(s==='push-dialog'){state.results=PROJECTS.map(evaluate);state.selected=new Set(['RX0077']);state.page='results';state.scenario=s;state.modal=true;render();return}if([...SCENES,...BOUNDARIES].some(([k])=>k===s))scene(s)});

render=function(){const p=state.page,g=v2Guides[p]||GUIDES[p]||GUIDES.home;$('#app').innerHTML=`<header class="reviewbar"><div><strong>黄隽团队 · 临床项目患者管理</strong><span>　V0.4 / 基于旧版科研中心</span></div><div class="row"><button data-action="coverage">全部功能说明</button><button data-action="reset">恢复初始</button></div></header><div class="layout legacy-layout"><nav class="scenarios" aria-label="演示控制台"><div class="control-head"><small>DEMO CONTROL</small><h2>演示控制台</h2><p>仅用于评审，不属于 Dx APP</p></div><div class="identity-card">黄隽教授团队<br><b>${role==='screener'?'初筛医生':role==='pi'?'项目 PI':'项目管理'}</b></div><div class="label">角色与视图</div>${[['screener','初筛医生','患者材料初筛'],['pi','项目 PI','后续进度 · 只读'],['manager','项目管理','项目列表 · 只读']].map(([id,t,sub])=>`<button data-action="role-${id}" class="${role===id?'active':''}"><b>${t}</b><small>${sub}</small></button>`).join('')}<div class="label">功能页面</div>${[['home','01 科研中心'],['upload','02 上传患者材料'],['archive','03 我的患者档案'],['results','04 初筛结果与依据'],['library','05 项目库 · 17项'],['progress','06 推送与进度']].map(([id,t])=>`<button data-scene="${id}" class="${state.scenario===id?'active':''}">${t}</button>`).join('')}<details id="boundary-nav" ${boundaryOpen?'open':''}><summary>边界与异常 · 5 项</summary>${BOUNDARIES.map(([id,t])=>`<button data-scene="${id}" class="${state.scenario===id?'active':''}">${t}</button>`).join('')}</details><small>场景切换保留推送记录。<br>恢复初始仅清空模拟状态。</small><a class="source-links" href="${LEGACY}" target="_blank" rel="noopener">旧版 Demo 参考 ↗</a></nav><section class="doctor-side"><div class="device-label">医生端　<span>Dx · 暖欣健康</span></div><main class="product ${state.modal?'has-modal':''}" data-review-scene="${esc(state.scenario)}"><div class="mobile-top"><button aria-label="${p==='home'?'打开菜单':'返回科研中心'}" data-action="${p==='home'?'menu':'home'}">${p==='home'?'☰':'‹'}</button><b>${titleFor()}</b><button aria-label="查看推送进度" data-action="progress">◷</button></div>${menuOpen?`<div class="menu-sheet"><button data-action="home">科研中心</button><button data-action="archive">我的患者</button><button data-action="library">研究项目</button><button data-action="progress">项目进度</button><button data-action="menu">关闭菜单</button></div>`:''}<div class="content" data-review-anchor="page-content">${p==='home'?overview():p==='upload'?uploadPage():p==='archive'?archivePage():p==='screen'?screening():p==='results'?results():p==='library'?library():p==='detail'?detail():p==='progress'?progress():coverage()}</div><div class="footer-note">仅用于初筛 · 虚构患者 · 最终由 PI 确认</div>${state.modal?pushModal():''}</main></section>${patientPanel()}<aside class="guide" data-review-anchor="current-guide"><div class="kicker">当前页面说明 · REVIEW GUIDE</div><h2>${state.modal?'推送 CRC 核对':g[0]}</h2><h3>页面与调整说明</h3><p>${state.modal?'沿用旧版选择项目后的交接路径；本次按流程图先交 CRC 细审，PI 保留最终判断。':g[1]}</p><h3>功能操作与预期结果</h3><ol>${(state.modal?['核对清单、输入备注并勾选确认→生成待CRC细审记录。','取消→保留选择和备注，不生成记录。','失败重试→保留备注；相同清单不重复创建。']:p==='results'&&resultTab!=='matches'?[`当前为${resultTab==='info'?'患者信息：点击修改可核对全部指标':'患者材料：点击摘要可展开虚构内容'}。`,'切回“匹配结果”→保留候选项目选择。']:g[2]).map(v=>`<li>${v}</li>`).join('')}</ol><h3>关键验收点</h3><ul>${(state.modal?['确认前不生成记录；确认后医生与患者进度同步。','无真实消息或患者资料传输。']:g[3]).map(v=>`<li>${v}</li>`).join('')}</ul><div class="note">指南优先级：待配置<br>候选不等于入组结论</div><p class="muted">界面依据：用户指定旧版实景；按本次范围重建交互，非 DX 正式组件验收版。</p><a href="${SOURCE}" target="_blank" rel="noopener">项目资料 ↗</a> · <a href="${FLOW}" target="_blank" rel="noopener">流程依据 ↗</a></aside></div>`;bind();$('#boundary-nav').ontoggle=e=>boundaryOpen=e.target.open;$('#demo-files')?.addEventListener('change',e=>{files=[...e.target.files].map(f=>f.name);render()});if(state.page!==previousPage||(state.modal&&!previousModal)){$('.product')?.scrollTo({top:0});}previousPage=state.page;previousModal=state.modal;};
scene=function(id){menuOpen=false;resultTab='matches';materialView=null;if(['upload','archive'].includes(id)){state.page=id;state.scenario=id;state.modal=false;render();return}oldScene(id)};
action=function(a,id){if(a==='menu'){menuOpen=!menuOpen;render();return}menuOpen=false;if(a.startsWith('role-')){role=a.slice(5);navigate(role==='pi'?'progress':role==='manager'?'library':'home');return}if(a.startsWith('tab-')){resultTab=a.slice(4);render();return}if(['upload','archive'].includes(a)){navigate(a);return}if(a==='sample'){state.patient={...initial};state.selected=new Set();state.results=[];resultTab='matches';materialView=null;navigate('screen');return}if(a==='manual-case'){state.patient={...initial};Object.keys(state.patient).forEach(k=>{if(k!=='name'&&k!=='consent')state.patient[k]=['age','ecog','chemo','et','slices','cps','biopsy'].includes(k)?'':'未知'});state.patient.central='待核验';state.results=[];state.selected=new Set();navigate('screen');return}if(a==='material'){materialView=Number(id);render();return}if(a==='close-material'){materialView=null;render();return}if(a==='detail-materials'){resultTab='info';navigate('results');return}if(a==='reset'){files=[];role='screener';resultTab='matches';materialView=null;}oldAction(a,id)};

render=function(){const p=state.page,g=currentGuide();const scrolls={product:$('.product')?.scrollTop||0,patient:$('.patient-device')?.scrollTop||0},same=p===previousPage;$('#app').innerHTML=`<header class="reviewbar"><div><strong>黄隽团队 · 临床项目患者管理</strong><span> V0.8.2 / V3.1 全流程核对</span></div><div class="row"><button data-action="coverage">9 步审查与功能说明</button><button data-action="reset">恢复初始</button></div></header><div class="flow-layout"><aside class="flow-sidebar"><section class="review-controls" aria-label="演示控制台"><div><b>演示角色</b><small>仅切换模拟视图，不代表真实权限</small></div><div class="role-buttons">${Object.entries(ROLE_NAMES).map(([id,t])=>`<button data-action="role-${id}" class="${role===id?'active':''}" aria-pressed="${role===id}">${t}</button>`).join('')}</div><label class="selectline"><input id="fail-next" type="checkbox" ${flow.failNext?'checked':''}>模拟下一次提交失败</label></section><nav class="flow-nav" aria-label="功能页面">${[['desk','医生首页'],['home','科研中心'],['invite','邀请患者'],['contact','患者沟通'],['archive','患者档案'],['upload','材料档案'],['results','初筛结果'],['library','项目库 · 17项'],['progress','项目进度与待办']].map(([id,t])=>`<button data-scene="${id}" class="${p===id?'active':''}">${t}</button>`).join('')}</nav></aside>${patientPanel()}<section class="doctor-side"><div class="device-label">DX 医生端 · ${ROLE_NAMES[role]} ${role==='patient'?'（医生视图只读）':''}</div><main class="product ${state.modal?'has-modal':''}" data-review-scene="${p==='case'?'case-'+currentCase()?.status:p}"><div class="mobile-top"><button aria-label="${['review','contact','patient-info'].includes(p)?'返回原页面':p==='case'?'返回项目进度':p==='detail'?'返回'+backLabel():'返回科研中心'}" data-action="${p==='patient-info'?'queue-back':p==='review'?'review-back':p==='contact'?'ext-back':p==='invite'?'home':p==='case'?'wf-back':p==='detail'?'back-detail':'home'}">‹</button><b>${p==='case'?'项目流转详情':p==='detail'?'项目核对依据':titleFor()}</b><div class="header-actions"><button aria-label="查看患者消息" data-action="contact">✉</button><button aria-label="查看项目进度 function extractCriteria(p){const lines=p.sourceText.replace(/([。；])(?=\d+\.\s)/g,'$1\n').split(/\n/),groups={in:[],out:[]};let kind=null,buffer='';function flush(){if(kind&&buffer.trim())groups[kind].push(buffer.trim());buffer=''}for(let line of lines){const header=line.match(/(入选标准|入选条件|入组标准|纳入标准|参加条件|主要入选标准|排除标准|排除条件|主要排除标准)\s*[：:]?/);if(header){flush();kind=/排除/.test(header[1])?'out':'in';line=line.slice(header.index+header[0].length)}if(!kind)continue;if(/^(?:联系人|CRC|研究者|负责|试验药|目标患者|招募状态)[:：]/.test(line.trim())){flush();kind=null;continue}if(/^\s*(?:\d+[.、．]|[（(]\d+[)）]|\[\d+\])/.test(line)&&buffer.trim())flush();buffer+=line+'\n'}flush();return [...groups.in.map((text,i)=>({key:'in'+i,kind:'in',label:'入'+String(i+1).padStart(2,'0'),text})),...groups.out.map((text,i)=>({key:'out'+i,kind:'out',label:'排'+String(i+1).padStart(2,'0'),text}))]}

function supplementForm(r,patient){const e=supplementEditor;if(!e||e.caseId!==r.id||e.role!==role||patient!==(role==='patient'))return '';const d=e.draft;return `<div class="supplement-form"><h3>补充检查 / 治疗资料</h3><p class="muted">${esc(r.projectId)} · 仅填写虚构演示信息</p><label class="field">资料类型<select data-supp="type">${['检查结果','治疗记录','其他病历'].map(t=>`<option ${d.type===t?'selected':''}>${t}</option>`).join('')}</select></label><label class="field">发生日期<input data-supp="date" type="date" value="${esc(d.date)}"></label><label class="field">资料标题<input data-supp="title" value="${esc(d.title)}" placeholder="例如：复查报告 / 本次治疗记录"></label><label class="field">内容与需要说明的情况<textarea data-supp="content" placeholder="填写检查结果摘要、已发生的治疗经过或需团队了解的情况">${esc(d.content)}</textarea></label><label class="field">资料来源 / 就诊机构<input data-supp="source" value="${esc(d.source)}" placeholder="例如：患者提供 / 外院报告"></label><label class="upload-box">选择演示附件<small>只保留文件名，不上传、不识别</small><input data-supp-files type="file" multiple accept="image/*,.pdf"></label>${d.files.map(f=>`<p class="muted">${esc(f)}</p>`).join('')}${supplementError?`<div role="alert" class="note danger">${esc(supplementError)}</div>`:''}<div class="supplement-actions"><button data-action="supp-sample" data-id="${r.id}">载入虚构示例</button><button class="primary full" data-action="supp-save" data-id="${r.id}">提交资料 · 待团队核对</button><button class="quiet full" data-action="supp-cancel">取消 · 保留草稿</button></div></div>`}
function supplementSection(r,patient=false){const records=r.supplements||[],editable=supplementRoles.includes(role)&&patient===(role==='patient'),open=supplementEditor?.caseId===r.id&&supplementEditor.role===role&&supplementEditor.open;return `<section class="card supplement-card" data-supp-card="${patient?'patient':'staff'}-${r.id}"><div class="supplement-heading"><h3>${patient?'检查与治疗资料':'后续检查与治疗资料'}</h3><span class="pill">${records.length} 条</span></div>${patient?`<p class="muted">${esc(r.projectId)} · ${esc(projectById(r.projectId).name)}</p>`:''}<p>补充复查结果、治疗经过或其他病历，供研究团队核对。</p>${editable?`<button class="primary full" data-action="supp-open" data-id="${r.id}">＋ 补充检查 / 治疗资料</button>`:'<p class="muted">切换患者、初筛医生、CRC 或 PI 可补充资料。</p>'}${open?supplementForm(r,patient):''}${records.length?`<div class="supplement-records">${[...records].reverse().map(s=>`<details class="supplement-record"><summary><span><b>${esc(s.title)}</b><small>${esc(s.date)} · ${esc(s.type)}</small></span><span class="pill ${s.checked?'green':'blue'}">${s.checked?'已核对':'待核对'}</span></summary><div class="supplement-record-body"><p>${esc(s.content)}</p><p class="muted">来源：${esc(s.source)}<br>提交：${esc(s.by)} · ${esc(s.at)}</p>${s.files.length?'<p>附件（仅文件名）：'+s.files.map(esc).join('、')+'</p>':''}${s.checked?`<div class="note good">${esc(s.checked.by)} 已核对 · ${esc(s.checked.at)}<p>${esc(s.checked.note)}</p></div>`:!patient&&['crc','pi'].includes(role)?`<label class="field">核对意见<textarea data-supp-note="${s.id}">${esc(s.reviewDraft||'')}</textarea></label><button data-action="supp-check" data-id="${r.id}|${s.id}">保存核对意见</button>`:'<p class="muted">等待 CRC / PI 核对。</p>'}</div></details>`).join('')}</div>`:'<div class="supplement-empty">暂无补充记录</div>'}<p class="muted">资料提交和核对不会自动改变入组状态，也不会替代正式检查结果审核或治疗医嘱。</p></section>`}
patientBody=function(){let h=supplementBase.patientBody();if(flow.authorized&&state.records.length)h=h.replace('<section class="card"><h3>我的项目进度</h3>',state.records.map(r=>supplementSection(r,true)).join('')+'<section class="card"><h3>我的项目进度</h3>');return h};
caseDetail=function(){let h=supplementBase.caseDetail(),r=currentCase();return r?h.replace('<details class="card project-records">',supplementSection(r)+'<details class="card project-records">'):h};
function supplementFail(t){supplementError=t;render()}
action=function(a,id){if(a==='reset'){supplementEditor=null;supplementError=''}if(!a.startsWith('supp-'))return supplementBase.action(a,id);const [rid,sid]=String(id||supplementEditor?.caseId||'').split('|'),r=state.records.find(x=>x.id===rid);if(!r||!flow.authorized||!supplementRoles.includes(role))return deny('请在已关联项目中以患者或研究团队角色操作');
if(a==='supp-open'){if(!supplementEditor||supplementEditor.caseId!==rid||supplementEditor.role!==role)supplementEditor={caseId:rid,role,draft:{type:'检查结果',date:'',title:'',content:'',source:'',files:[]}};supplementEditor.open=true;supplementError='';render();$('.supplement-form')?.scrollIntoView({block:'center'});return}
if(a==='supp-cancel'){supplementEditor.open=false;supplementError='';render();return}
if(a==='supp-check'){if(!['crc','pi'].includes(role))return deny('仅 CRC / PI 可核对');const s=r.supplements?.find(x=>x.id===sid);if(!s||s.checked)return;if(!s.reviewDraft?.trim())return deny('请填写核对意见');if(flow.failNext){flow.failNext=false;return deny('模拟保存失败，核对意见已保留，请重试')}s.checked={by:ROLE_NAMES[role],at:stamp(),note:s.reviewDraft.trim()};render();document.querySelector('[data-supp-card="staff-'+rid+'"]')?.scrollIntoView({block:'start'});toast('核对意见已保存，项目阶段未改变');return}
if(!supplementEditor||supplementEditor.role!==role)return;const d=supplementEditor.draft;
if(a==='supp-sample'){Object.assign(d,{type:'检查结果',date:'2026-09-29',title:'虚构复查报告',content:'演示资料摘要：复查结果待研究团队结合完整报告核对。',source:'虚构演示机构',files:['虚构复查报告.pdf']});supplementError='';render();return}
if(a==='supp-save'){if(!d.date||!d.title.trim()||!d.content.trim()||!d.source.trim())return supplementFail('请补全发生日期、标题、内容和来源。');if(d.date>new Date().toLocaleDateString('en-CA'))return supplementFail('这里只记录已发生的检查或治疗，日期不能晚于今天。');if(flow.failNext){flow.failNext=false;return supplementFail('模拟提交失败，草稿已保留，请重试。')}(r.supplements??=[]).push({...d,files:[...d.files],id:'SUP-'+(r.supplements.length+1),by:ROLE_NAMES[role],at:stamp(),checked:null});supplementEditor=null;supplementError='';if(!isTerminal(r)&&r.status!=='enrolled'){const rv=reviewState(r.projectId);rv.history.push({previous:rv.values,version:rv.version,reason:'新增检查或治疗资料'});rv.values={};}render();document.querySelector('[data-supp-card="'+(role==='patient'?'patient':'staff')+'-'+rid+'"]')?.scrollIntoView({block:'start'});toast('资料已同步，待研究团队核对');return}}
render=function(){supplementBase.render();document.querySelectorAll('[data-supp]').forEach(el=>el.addEventListener('input',()=>{if(supplementEditor)supplementEditor.draft[el.dataset.supp]=el.value}));document.querySelectorAll('[data-supp-files]').forEach(el=>el.addEventListener('change',()=>{if(supplementEditor){supplementEditor.draft.files=[...el.files].map(x=>x.name);render()}}));document.querySelectorAll('[data-supp-note]').forEach(el=>el.addEventListener('input',()=>{for(const r of state.records){const s=r.supplements?.find(x=>x.id===el.dataset.suppNote);if(s&&r.id===currentCase()?.id)s.reviewDraft=el.value}}))};

document.addEventListener('click',function(e){const panel=e.target.closest?.('.patient-side');if(!panel||role==='patient')return;const control=e.target.closest('button,input,textarea,select,label,summary,a');if(!control)return;const path=[];let node=control;while(node!==panel){path.unshift([...node.parentElement.children].indexOf(node));node=node.parentElement}e.preventDefault();e.stopImmediatePropagation();role='patient';render();let replacement=document.querySelector('.patient-side');for(const i of path)replacement=replacement?.children[i];if(!replacement)return;if(replacement.matches('input:not([type=checkbox]):not([type=file]),textarea,select'))replacement.focus({preventScroll:true});else replacement.click();},true);

function queueReports(){let a=[];if(preparation.kind==='sample')a=materialSamples.map((m,i)=>({id:'base-'+i,title:m[0],date:'',category:['病理 / 基因','诊疗记录','影像检查','化验检查'][i],text:m[2],source:'虚构演示摘要',files:[]}));if(preparation.kind==='files')a=files.map((f,i)=>({id:'file-'+i,title:f,date:'',category:'其他',text:'仅选择文件名，尚未解析。',source:'本地选择',files:[f]}));a.push(...extra.materialExtras.map((m,i)=>({id:'extra-'+i,title:m.name,date:'',category:'其他',text:'虚构补充报告，待核对。',source:'患者补充',files:[]})));for(const r of state.records)for(const [i,s] of (r.supplements||[]).entries())a.push({id:r.id+'-'+i,title:s.title,date:s.date,category:s.type==='治疗记录'?'诊疗记录':'其他',text:s.content,source:s.source,files:s.files});return a.sort((a,b)=>b.date.localeCompare(a.date))}
function queueLogs(){const rows=[];if(flow.authorized)rows.push({kind:'授权',at:flow.authorizedAt||'',by:'患者',text:'完成授权并绑定接诊医生'});for(const r of state.records){for(const l of r.log)rows.push({kind:'项目流转',at:l.at,by:l.role,text:r.projectId+' · '+l.text});for(const s of r.supplements||[]){rows.push({kind:'资料',at:s.at,by:s.by,text:'提交：'+s.title});if(s.checked)rows.push({kind:'资料',at:s.checked.at,by:s.checked.by,text:'核对：'+s.title+' · '+s.checked.note})}}for(const m of extra.messages)rows.push({kind:'沟通',at:m.at,by:m.sender,text:m.text});for(const c of extra.callLog)rows.push({kind:'沟通',at:c.at,by:'研究团队',text:c.result});return rows.sort((a,b)=>(Date.parse(b.at)||0)-(Date.parse(a.at)||0))}

action=function(a,id){if(a==='reset')queueUI={tab:'detail',folder:'timeline',category:'全部',search:'',filter:'全部',event:'全部事件',report:null,compose:false,back:'detail'};if(!a.startsWith('queue-'))return queueBase.action(a,id);if(a==='queue-filter'){queueUI.filter=id;render();return}if(a==='queue-back'){if(queueUI.tab==='detail'){state.page='archive'}else queueUI.tab='detail';queueUI.compose=false;queueUI.report=null;render();return}if(a==='queue-compose-close'){queueUI.compose=false;render();return}if(!flow.authorized)return deny('请先完成患者授权绑定');if(a==='queue-open'){queueUI.tab='detail';queueUI.compose=false;state.page='patient-info'}if(a==='queue-compose'){state.page='patient-info';queueUI.compose=true}if(a==='queue-folder'){queueUI.tab='folder';queueUI.report=null}if(a==='queue-log')queueUI.tab='log';if(a==='queue-folder-tab'){queueUI.folder=id;queueUI.report=null}if(a==='queue-category')queueUI.category=id;if(a==='queue-report')queueUI.report=id;if(a==='queue-report-close')queueUI.report=null;if(a==='queue-metric-source'){queueUI.folder='category';queueUI.category='病理 / 基因'}render()};
render=function(){queueBase.render();$('#queue-search')?.addEventListener('input',e=>{queueUI.search=e.target.value;const pos=e.target.selectionStart;render();$('#queue-search').focus();$('#queue-search').setSelectionRange(pos,pos)});$('#queue-log-filter')?.addEventListener('change',e=>{queueUI.event=e.target.value;render()})};

// Demonstration-only AI review: explicit rule-based evidence, no model or clinical service.
const aiBase={reviewState,reviewPage,action,render};
function reviewFingerprint(pid){const r=state.records.find(x=>x.projectId===pid);return JSON.stringify({v:flow.version,p:state.patient,kind:preparation.kind,materials:extra.materialExtras,icf:r?.icf,sign:r?.piSignoff,checks:r?.checks,supp:r?.supplements})}
function simulateAIReview(pid,rv){if(rv.aiFingerprint)rv.history.push({previous:JSON.parse(JSON.stringify(rv.values)),confirmation:rv.confirmation,version:rv.version,reason:'AI重新复核'});const preliminary=evaluate(projectById(pid)).rules||[];rv.values={};for(const x of rv.items){let status='unknown',note='现有结构化资料不足以核实整条条件，请人工检查原始资料或补充资料。',source='';const t=x.text.replace(/^\s*\d+[.、．]\s*/,''),age=t.match(/(?:年龄)?\s*(\d+)\s*[~～–—\-至]\s*(\d+)\s*(?:岁|周岁)/);if(x.kind==='in'&&age&&t.length<85&&!/病理|治疗|肿瘤|签署/.test(t)&&state.patient.age!==''&&state.patient.age!=null){status=+state.patient.age>=+age[1]&&+state.patient.age<=+age[2]?'pass':'fail';note=`已录入年龄 ${state.patient.age} 岁；条款范围 ${age[1]}–${age[2]} 岁。`;if(/女性|男性/.test(t)&&!/性别不限/.test(t)){status='unknown';note+=' 条款含性别条件，需核对整条。'}source='患者结构化资料'}else if(x.kind==='in'&&/ECOG/i.test(t)&&t.length<65&&!/病灶|器官|生存|治疗/.test(t)&&/0\s*[~～–—\-至]\s*1|[≤≤]\s*1/.test(t)&&state.patient.ecog!==''&&state.patient.ecog!=null){status=+state.patient.ecog<=1?'pass':'fail';note=`已录入 ECOG ${state.patient.ecog} 分；仅对照此条评分范围。`;source='检验摘要（虚构）'}else if(x.kind==='in'&&/组织切片/.test(t)&&t.length<55&&state.patient.slices!==''&&state.patient.slices!=null){const range=t.match(/(\d+)\s*[-–~～]\s*(\d+)\s*片/);if(range){status=+state.patient.slices>=+range[1]?'pass':'fail';note=`已录入可提供组织切片 ${state.patient.slices} 片；条款要求 ${range[1]}–${range[2]} 片，按可提供数量核对下限。`;source='患者结构化资料'}}else{const hits=preliminary.filter(q=>/HER2/i.test(t)&&/HER2/.test(q.label)||/激素受体|HR.*阳性|ER.*阳性/.test(t)&&q.label==='激素受体'||/中心实验室/.test(t)&&/中心/.test(q.label));if(hits.length){note=hits.map(q=>`${q.label}：${q.actual}；要求：${q.expected}`).join('。')+'。上述仅为部分依据，整条条件仍需人工核实。';source=/HER2|激素受体|HR|ER/.test(t)?'病理摘要（虚构）':''}}rv.values[x.key]={status,note,source,by:'AI 复核（模拟）'}}rv.version=flow.version;rv.aiFingerprint=reviewFingerprint(pid);rv.aiAt=stamp();rv.confirmation=null;rv.confirmDraft='';rv.confirmCheck=false}
reviewState=function(pid){const rv=aiBase.reviewState(pid);if(rv.aiFingerprint!==reviewFingerprint(pid))simulateAIReview(pid,rv);return rv};
function aiReviewPanel(rv){const c=reviewCounts(rv);return `<section class="card ai-review-panel"><span class="pill blue">AI 自动复核 · 演示规则</span><h2>${rv.confirmation?'AI 复核已完成人工确认':'AI 已整理，待人工检查确认'}</h2><p>进入页面自动对照当前资料，展示初判与依据。无需逐条重复点击；有误的条目可单独修改。</p><div class="stats"><div class="stat"><b>${c.pass}</b><span>初判符合</span></div><div class="stat"><b>${c.unknown}</b><span>需人工核实</span></div><div class="stat"><b>${c.fail}</b><span>存在不符合</span></div></div><p class="muted">此 Demo 使用规则模拟 AI，未连接真实模型。缺少资料不会自动判为符合。</p>${rv.confirmation?`<div class="note good"><b>人工已整体确认</b><p>${esc(rv.confirmation.by)} · ${esc(rv.confirmation.at)}</p><p>${esc(rv.confirmation.note||'已检查当前复核结果')}</p></div>`:`<label class="field">人工复核说明${c.unknown?'（有待核实项时必填）':''}<textarea id="ai-confirm-note" placeholder="说明待核实项的核查依据或处理情况；尚未核实请先补充资料">${esc(rv.confirmDraft||'')}</textarea></label><label class="selectline"><input id="ai-confirm-check" type="checkbox" ${rv.confirmCheck?'checked':''} ${!canEditReview()?'disabled':''}>我已检查 AI 依据，并人工核实待确认项；修改意见已处理。</label><button class="primary full" data-action="ai-confirm" ${!canEditReview()?'disabled':''}>确认整体复核结果</button>`}<button class="quiet full" data-action="review-recheck">重新运行 AI 复核</button><p class="muted">仅确认人工复核，不代表正式入组；条款原有 AI 状态保留可追溯，最终由 PI 判定。</p></section>`}
reviewPage=function(){const rv=reviewState(extra.reviewProject);let h=aiBase.reviewPage();if(extra.reviewTab==='criteria'){h=h.replace('<section class="card review-summary">',aiReviewPanel(rv)+'<section class="card review-summary">');h=h.replace('<h2>入排标准明细</h2>','<h2>AI 初判与资料依据</h2>').replace('已逐条核对','AI 初判已完成').replace('逐条复核不会自动推进流程','整体复核确认不会自动推进流程').replace('重新核对当前资料','重新运行 AI 复核').replace('请结合当前资料逐条核验','请检查 AI 结果与依据')}return h};
action=function(a,id){if(a==='review-batch-pass'){
 if(!canEditReview())return deny('当前角色只读');
 if(!['in','out'].includes(id))return;
 const rv=reviewState(extra.reviewProject),items=rv.items.filter(x=>x.kind===id);if(!items.length)return;
 if(flow.failNext){flow.failNext=false;return deny('模拟保存失败，未修改条目，请重试。')}
 rv.history.push({previous:structuredClone(rv.values),confirmation:structuredClone(rv.confirmation),kind:id,by:ROLE_NAMES[role],at:stamp(),reason:'演示批量设置：'+(id==='in'?'全部符合':'全部未触发排除')});
 for(const x of items)rv.values[x.key]={status:'pass',note:id==='in'?'演示预设：本条入选条件符合，可按演示情景逐项修改。':'演示预设：未触发本条排除条件，可按演示情景逐项修改。',source:'',by:ROLE_NAMES[role]+'（演示批量设置）'};
 rv.confirmation=null;rv.confirmCheck=false;extra.ruleEditor=null;extra.ruleDraft=null;flow.error='';render();toast('已设置本组 '+items.length+' 项；未提交整体复核或推进流程');return;
 }if(a==='review-recheck'){if(!canEditReview())return deny('当前角色只读');const rv=aiBase.reviewState(extra.reviewProject);simulateAIReview(extra.reviewProject,rv);extra.ruleEditor=null;extra.reviewFilter='all';render();toast('AI 已重新复核，请检查并整体确认');return}if(a==='ai-confirm'){if(!canEditReview())return deny('请由初筛医生、CRC 或 PI 检查确认');const rv=reviewState(extra.reviewProject),c=reviewCounts(rv);if(!rv.items.length)return deny('项目未提供可复核条款，请先补齐项目规则');if(c.fail)return deny('仍有不符合条款，请核实依据并处理，不能直接整体通过');if(!rv.confirmCheck)return deny('请先勾选人工检查确认');if(c.unknown&&!rv.confirmDraft.trim())return deny('请填写待核实项的人工核查依据或处理情况');if(flow.failNext){flow.failNext=false;return deny('模拟保存失败，人工复核输入已保留')}rv.confirmation={by:ROLE_NAMES[role],at:stamp(),note:rv.confirmDraft,fingerprint:reviewFingerprint(extra.reviewProject)};rv.history.push({confirmation:{...rv.confirmation}});render();toast('人工整体复核已确认，无需逐条重复点击');return}if(a==='review-save'){const rv=reviewState(extra.reviewProject),before=rv.history.length;aiBase.action(a,id);if(rv.history.length>before){rv.confirmation=null;render()}return}return aiBase.action(a,id)};
render=function(){aiBase.render();$('#ai-confirm-note')?.addEventListener('input',e=>reviewState(extra.reviewProject).confirmDraft=e.target.value);$('#ai-confirm-check')?.addEventListener('change',e=>reviewState(extra.reviewProject).confirmCheck=e.target.checked)};
const aiSourceExcerpt=sourceExcerpt;
sourceExcerpt=function(source){return source==='患者结构化资料'?`当前已录入：年龄 ${state.patient.age??'未提供'} 岁；可提供组织切片 ${state.patient.slices??'未提供'} 片。请结合原始报告核实。`:aiSourceExcerpt(source)};

const teamStaff=()=>['screener','crc','pi','manager'].includes(role);
const senderIdentity=()=>({sender:role==='manager'?'黄隽主任（演示）':({screener:'接诊医生（演示）',crc:'项目 CRC（演示）',pi:'PI 研究者（演示）'}[role]||'演示患者 A'),senderRole:ROLE_NAMES[role]});
function messageSource(m){return `${m.sender}${m.senderRole&&m.senderRole!==m.sender?' · '+m.senderRole:''} · ${m.projectId||'研究团队'} · ${m.scope==='group'?'项目群发':m.from==='patient'?'患者回复':'单发'} · ${m.at}`}
sendLocal=function(from,text){const r=state.page==='case'?currentCase():null;const identity=from==='patient'?{sender:'演示患者 A',senderRole:'患者'}:senderIdentity();extra.messages.push({from,...identity,text,at:stamp(),projectId:r?.projectId||null,scope:'single',recipientId:'A'})};
patientCommunication=function(){let h=teamBase.patientCommunication();for(const m of extra.messages.slice(-5))h=h.replace(`<small>${esc(m.sender)}</small>`,`<small class="message-source">${esc(messageSource(m))}</small>`);return h};
function teamMembers(){const a=state.records.map(r=>({id:'A',name:'演示患者 A',age:r.patient.age,projectId:r.projectId,status:r.status,enrollment:r.enrollment||'',enrolledAt:r.enrolledAt||'',materials:r.materials,followups:r.followups||[],recordId:r.id,origin:'本次演示流程'}));return [...a,...team.roster]}
function teamVisible(project=team.project,phase=team.phase){return teamMembers().filter(x=>(project==='全部'||x.projectId===project)&&(phase==='all'||x.status==='enrolled')&&(!team.query||x.name.includes(team.query)||x.enrollment.includes(team.query)))}
function teamButton(a,t,c='quiet full',id=''){return `<button data-action="${a}" data-id="${esc(id)}" class="${c}">${t}</button>`}
function projectOptions(value,all=false){return `${all?'<option value="全部">全部项目</option>':'<option value="">请选择科研项目</option>'}${PROJECTS.map(p=>`<option value="${p.id}" ${value===p.id?'selected':''}>${p.id} · ${esc(p.name)}</option>`).join('')}`}
function managerOverview(){const enrolled=teamMembers().filter(x=>x.status==='enrolled'),visible=teamVisible();return `<h1>黄隽主任 · 患者总览</h1><p class="muted">跨科研项目查看患者资料、入组状态与随访记录。</p><div class="stats"><div class="stat"><b>${new Set(enrolled.map(x=>x.id)).size}</b><span>正式入组患者</span></div><div class="stat"><b>${new Set(enrolled.map(x=>x.projectId)).size}</b><span>开展项目</span></div><div class="stat"><b>${enrolled.filter(x=>!x.followups.length).length}</b><span>待安排随访</span></div></div><section class="card team-filters"><label class="field">科研项目<select id="team-project">${projectOptions(team.project,true)}</select></label><label class="field">患者范围<select id="team-phase"><option value="enrolled" ${team.phase==='enrolled'?'selected':''}>正式入组患者</option><option value="all" ${team.phase==='all'?'selected':''}>全部阶段（含拟入组）</option></select></label><label class="field">搜索患者 / 入组编号<input id="team-query" value="${esc(team.query)}" placeholder="输入患者姓名或入组编号"></label>${teamButton('project-message','按科研项目发消息','primary full')}${!team.roster.length?teamButton('team-sample','载入虚构多患者队列'): '<p class="muted">已载入独立虚构队列，不改变当前患者的九步进度。</p>'}</section><div class="row between"><h2>患者列表</h2><span class="pill">${new Set(visible.map(x=>x.id)).size} 人 · ${visible.length} 条项目记录</span></div>${visible.map(x=>`<section class="card team-patient"><div class="row between"><h3>${esc(x.name)}</h3><span class="pill ${x.status==='enrolled'?'green':'amber'}">${x.status==='enrolled'?'正式入组':statusText({status:x.status})}</span></div><p>${x.projectId} · ${esc(projectById(x.projectId).name)}</p><dl class="check-record"><dt>入组编号</dt><dd>${esc(x.enrollment||'尚未正式入组')}</dd><dt>随访</dt><dd>${x.followups.length?esc(x.followups.at(-1).date+' · '+x.followups.at(-1).content):'待研究团队安排'}</dd></dl><div class="entry-grid">${teamButton('team-person','查看患者信息','full',x.id+'|'+x.projectId)}${teamButton('team-single','单发消息','primary full',x.id+'|'+x.projectId)}</div><small>${esc(x.origin)}</small></section>`).join('')||'<section class="card empty">当前范围暂无患者。只有 PI 最终同意入组后才计入正式入组。</section>'}`}
function teamPerson(){const x=teamMembers().find(x=>x.id+'|'+x.projectId===team.person);if(!x)return '<div class="card">患者记录已变化，请返回总览。</div>';return `${teamButton('team-home','← 返回患者总览')}<section class="card"><div class="row between"><h1>${esc(x.name)}</h1><span class="pill">${x.status==='enrolled'?'正式入组':'拟入组 / 审核中'}</span></div><p>${x.age} 岁 · 虚构患者</p><p>${x.projectId} · ${esc(projectById(x.projectId).name)}</p><p>入组编号：${esc(x.enrollment||'未正式入组')}</p><p>入组时间：${esc(x.enrolledAt||'尚未入组')}</p>${teamButton('team-single','给此患者发消息','primary full',team.person)}</section>${x.id==='A'?`<section class="card"><h3>完整患者资料与项目记录</h3>${teamButton('queue-open','病历夹 / 处理日志 / 患者详情')}${teamButton('wf-open','查看此项目九步流转记录','primary full',x.recordId)}</section>`:`<section class="card"><h3>病历资料</h3><p>${x.materials} 份虚构资料；此队列仅用于演示跨患者查看与群发。</p><details><summary>检查与治疗摘要</summary><p>虚构示例：项目要求的检查已由团队核对，治疗与随访按研究团队安排进行。未提供真实患者报告。</p></details></section>`}<section class="card"><h3>随访安排</h3>${x.followups.map(f=>`<p>${esc(f.date)} · ${esc(f.content)}</p>`).join('')||'<p>尚未安排随访</p>'}</section><section class="card"><h3>消息记录 · 患者收件预览</h3>${team.deliveries.filter(m=>m.recipientId===x.id&&m.projectId===x.projectId).map(m=>`<div class="chat-bubble"><small>${esc(messageSource(m))}</small><p>${esc(m.text)}</p></div>`).join('')||'<p class="muted">暂无按项目发送的消息</p>'}</section>`}

muted">仅向虚构患者的演示收件箱发送，不联系真实人员。多人同项目去重，不包含未选择的患者。</p>`}

action=function(a,id){if(a==='reset'){team={project:'全部',query:'',phase:'enrolled',roster:[],person:null,msgProject:'',msgPhase:'enrolled',selected:new Set(),text:'',preview:null,receipt:null,deliveries:[],sequence:0}}if(a.startsWith('role-'))resetMessagePreview();if(a==='role-manager'){role='manager';state.page='progress';render();return}if(!a.startsWith('team-')&&!a.startsWith('message-')&&a!=='project-message')return teamBase.action(a,id);if(!teamStaff())return deny('当前角色无权执行此操作');if(a==='team-home'){state.page='progress';render();return}if(a==='team-sample'){if(role!=='manager')return deny('请由主任在总览中载入虚构队列');if(!team.roster.length)team.roster=[{id:'B',name:'演示患者 B',age:52,projectId:'RX0077',status:'enrolled',enrollment:'SIM-B-001',enrolledAt:'虚构队列示例',materials:3,followups:[{date:'2026-10-20',content:'虚构随访安排'}],origin:'独立虚构队列示例'},{id:'C',name:'演示患者 C',age:61,projectId:'RX0077',status:'enrolled',enrollment:'SIM-C-001',enrolledAt:'虚构队列示例',materials:4,followups:[],origin:'独立虚构队列示例'},{id:'D',name:'演示患者 D',age:48,projectId:'RX0099',status:'enrolled',enrollment:'SIM-D-001',enrolledAt:'虚构队列示例',materials:2,followups:[],origin:'独立虚构队列示例'}];render();return}if(a==='team-person'){if(role!=='manager')return;team.person=id;state.page='team-person';render();return}if(a==='project-message'||a==='team-single'){resetMessagePreview();if(a==='team-single'){const [pid,project]=id.split('|');team.msgProject=project;team.msgPhase='all';team.selected=new Set([pid])}else{team.msgProject=team.project!=='全部'?team.project:currentCase()?.projectId||team.msgProject;team.selected=new Set()}state.page='project-message';render();return}if(a==='message-select-all'){team.selected=new Set(projectRecipients().map(x=>x.id));resetMessagePreview();render();return}if(a==='message-cancel'){team.preview=null;render();return}if(a==='message-preview'){const people=projectRecipients().filter(x=>team.selected.has(x.id));if(!team.msgProject||!people.length)return deny('请选择科研项目及至少一位患者');if(!team.text.trim())return deny('请填写消息内容');team.preview={projectId:team.msgProject,people:people.map(x=>({id:x.id,name:x.name})),text:team.text.trim(),sender:senderIdentity(),role};team.receipt=null;render();return}if(a==='message-send'){const p=team.preview;if(!p||p.role!==role)return deny('请重新预览消息及收件人');const allowed=new Set(projectRecipients().map(x=>x.id));if(p.people.some(x=>!allowed.has(x.id)))return deny('患者范围已变化，请重新预览');if(flow.failNext){flow.failNext=false;return deny('模拟发送失败，内容与收件人已保留，请重试')}const at=stamp(),scope=p.people.length>1?'group':'single';for(const person of p.people){const m={id:'TEAM-'+(++team.sequence),from:'staff',...p.sender,text:p.text,at,projectId:p.projectId,scope,recipientId:person.id};team.deliveries.push(m);if(person.id==='A')extra.messages.push({...m})}team.receipt={count:p.people.length,at};team.preview=null;team.text='';team.selected=new Set();render();toast('项目消息已模拟送达');return}}
render=function(){teamBase.render();for(const [id,key] of [['team-project','project'],['team-phase','phase'],['message-project','msgProject'],['message-phase','msgPhase']])$('#'+id)?.addEventListener('change',e=>{team[key]=e.target.value;team.selected=new Set();resetMessagePreview();render()});$('#team-query')?.addEventListener('input',e=>{team.query=e.target.value;const pos=e.target.selectionStart;render();$('#team-query').focus();$('#team-query').setSelectionRange(pos,pos)});$('#project-message-text')?.addEventListener('input',e=>{team.text=e.target.value;team.preview=null;team.receipt=null;document.querySelector('.message-preview')?.remove();document.querySelector('.message-receipt')?.remove()});document.querySelectorAll('[data-message-patient]').forEach(el=>el.addEventListener('change',()=>{el.checked?team.selected.add(el.dataset.messagePatient):team.selected.delete(el.dataset.messagePatient);resetMessagePreview();render()}))};

function shellReferencePage(){const names={search:'智能搜索',favorites:'我的收藏',team:'团队管理',example:'医学问答演示'};if(shellSection==='team')return `<section class="dx-reference"><div class="dx-team-banner"><small>团队管理</small><h1>黄隽团队 · 临床科研协作</h1><p>演示角色与职责 · 虚构团队</p></div><section class="card"><h2>团队成员与职责</h2><p class="muted">左侧“演示角色”可切换视图，查看同一患者在各环节的处理方式。</p>${Object.entries(ROLE_NAMES).filter(([k])=>k!=='patient').map(([k,t])=>`<div class="dx-team-row"><b>${t}</b><span>${{screener:'绑定患者、核对资料、初筛推送',crc:'拟入组审核、检查安排、结果审核与随访',pi:'主导知情同意、最终入组判定',manager:'跨项目查看患者与随访、单发或群发消息'}[k]}</span></div>`).join('')}<button class="primary" data-shell="clinical">进入临床实验</button></section><section class="card"><h2>角色与患者可见范围</h2><p>实际 SIT 团队管理支持按角色配置本人、指定人或全团队患者范围。本页仅展示科研分工，不修改真实团队权限。</p></section></section>`;return `<section class="dx-reference"><h1>${names[shellSection]||'功能演示'}</h1><section class="card"><h2>${shellSection==='favorites'?'暂无演示收藏':'首页入口已保留'}</h2><p>当前 Demo 重点演示临床实验流程，该入口未连接实际检索或诊疗服务。</p><button class="primary" data-shell="clinical">进入临床实验</button><button data-shell="home">返回首页</button></section></section>`}
action=function(a,id){if(a==='reset'){shellSection='home';shellQuestion=''}if(a==='desk'){shellSection='home'}if(a==='coverage'){shellSection='clinical'}if(a.startsWith('role-')&&['home','team','search','favorites','example'].includes(shellSection)){role=a.slice(5);resetMessagePreview();render();return}return shellBase.action(a,id)};
function shellNavigate(section){if(section==='collapse'){shellCollapsed=!shellCollapsed;render();return}shellSection=section;if(section==='home'){state.page='desk'}else if(section==='clinical'){if(['desk','coverage'].includes(state.page))state.page=role==='manager'?'progress':'home'}else if(section==='patients')state.page='archive';else if(section==='records')state.page='upload';else if(section==='tasks')state.page='progress';render()}

function aptSuccessCards(){return apt.requests.filter(r=>r.status==='approved').map(r=>`<section class="apt-success-card"><div class="apt-success-heading"><span>✓</span><div><small>门诊加号申请</small><h2>加号成功</h2></div><b>${r.read?'已查看':'新通知'}</b></div><p class="apt-success-intro">请按以下时间前往门诊办理人工加号。</p><div class="apt-success-time"><small>就诊时间${r.appointment?.source?' · 演示排班':''}</small><strong>${esc(r.appointment?.date||r.date)}</strong><span>${esc(r.appointment?.period||'时段以医院通知为准')}</span></div><dl><dt>预约医生</dt><dd>${esc((r.doctor||aptTargetDoctor).name)}</dd><dt>就诊地点</dt><dd>${esc(r.location||aptLocation(r))}</dd></dl><div class="apt-success-note">具体院区、楼层及诊室以医院当日通知为准。加号申请通过不等于已完成医院挂号。</div><footer>${esc(r.reviewer)} · ${esc(r.reviewedAt)}</footer>${!r.read?aptBtn('read','我知道了','full',r.id):''}</section>`).join('')}

action=function(a,id){if(a==='reset')apt=aptEmpty();if(a.startsWith('role-')&&state.page==='appointments'){role=a.slice(5);resetMessagePreview();apt.edit=null;render();return}if(!a.startsWith('apt-'))return aptBase.action(a,id);apt.error='';const cmd=a.slice(4);if(cmd==='list'){shellSection='patients';state.page='appointments';render();return}if(cmd==='research'){state.page='progress';render();return}if(cmd==='tab'){apt.tab=id;apt.edit=null;render();return}if(['official','apply','back','submit','read'].includes(cmd)){if(role!=='patient')return aptFail('请在患者端操作');if(cmd==='read'){const r=apt.requests.find(x=>x.id===id);if(r)r.read=true;render();return}if(cmd==='official'||cmd==='back'){apt.view=cmd==='back'?'home':'official';render();return}if(cmd==='apply'){apt.view='apply';if(!apt.draft.age)apt.draft.age=String(state.patient.age||'');render();return}const d=apt.draft;if(!d.name.trim()||!d.age||+d.age<1||+d.age>120)return aptFail('请核对患者姓名与年龄');if(!/^\d{4}-\d{2}-\d{2}$/.test(d.date)||d.date<aptToday())return aptFail('请选择今天或之后的期望加号日期');if(apt.requests.some(r=>r.date===d.date&&r.status!=='rejected'))return aptFail('该日期已有待审核或已通过申请，请勿重复提交');if(flow.failNext){flow.failNext=false;return aptFail('模拟提交失败，填写内容已保留，请重试')}apt.requests.push({...d,doctor:{...aptTargetDoctor},tags:preparation.kind==='sample'?[state.patient.hr, state.patient.her2?'HER2 '+state.patient.her2:''].filter(Boolean):[],id:'APT-'+(++apt.serial),at:stamp(),status:'pending',read:false});apt.view='home';render();toast('加号申请已提交，医生患者管理中可查看');return}if(!aptCanReview())return aptFail('当前角色无审核权限');if(cmd==='cancel-review'){apt.edit=null;render();return}const r=apt.requests.find(x=>x.id===id);if(!r||r.status!=='pending')return aptFail('申请状态已变化，请查看最新列表');if(cmd==='approve-open'||cmd==='reject-open'){apt.edit={id,type:cmd==='approve-open'?'approved':'rejected'};apt.comment='';apt.location='';apt.slot='';render();return}if(cmd==='decide'){if(apt.edit?.id!==id)return aptFail('请先选择通过或拒绝');const slot=aptScheduleOptions().find(s=>s.id===apt.slot);if(apt.edit.type==='approved'&&!slot)return aptFail('请选择就诊日期与时段');if(flow.failNext){flow.failNext=false;return aptFail('模拟审核提交失败，输入已保留，请重试')}r.status=apt.edit.type;if(r.status==='approved'){r.appointment=slot;}r.location=r.status==='approved'?aptLocation(r):'';r.reviewer=senderIdentity().sender;r.reviewedAt=stamp();r.result=r.status==='approved'?`您预约 ${(r.doctor||aptTargetDoctor).name} 的加号申请已通过，请于 ${r.appointment.date} ${r.appointment.period}（演示排班）前往 ${r.location} 办理人工加号就诊，具体院区、楼层及诊室以医院当日通知为准。此通知不等于已完成医院挂号。`:`您预约 ${(r.doctor||aptTargetDoctor).name} 的加号申请未通过，建议您下次提前通过医院官方平台挂号。`;extra.messages.push({from:'staff',...senderIdentity(),at:r.reviewedAt,text:r.result,scope:'single',projectId:'门诊加号',recipientId:'A'});apt.edit=null;render();toast('审核结果已同步患者通知');return}};
render=function(){aptBase.render();document.querySelectorAll('[data-apt-field]').forEach(el=>el.addEventListener('input',()=>{const k=el.dataset.aptField;if(k==='location'||k==='comment'||k==='slot')apt[k]=el.value;else apt.draft[k]=el.value}));if(state.page==='appointments'){$('.dx-clinical-toolbar>div>b').textContent='患者管理';$('.dx-clinical-toolbar>div>span').textContent='患者队列 · 加号申请'}$('.reviewbar span').textContent=' V0.9.46'};

let researchQuery='',researchStatus='全部';
const researchStatusOf=p=>/暂停/.test(p.status)?'暂停入组':/未招募/.test(p.status)?'未招募':'待核实';
function researchProjects(){
 const rank={'待核实':0,'暂停入组':1,'未招募':2};
 const list=PROJECTS.filter(p=>(researchStatus==='全部'||researchStatusOf(p)===researchStatus)&&(p.id+' '+p.name+' '+p.title+' '+p.target).toLowerCase().includes(researchQuery.trim().toLowerCase())).sort((a,b)=>rank[researchStatusOf(a)]-rank[researchStatusOf(b)]||a.id.localeCompare(b.id));
 return `<section class="research-catalog"><div class="heading"><h2>研究项目 · 共 ${PROJECTS.length} 项</h2><button data-action="library" class="quiet">查看项目库 ›</button></div><p class="muted">团队项目资料，非患者匹配结果。招募状态以 CRC 最新核实为准。</p><form id="research-search-form"><label class="sr-only" for="research-query">搜索研究项目</label><div class="research-search-row"><input id="research-query" value="${esc(researchQuery)}" placeholder="搜索项目编号、药物或人群"><button type="button" id="research-search-button">搜索</button></div><label class="research-status-label">招募状态<select id="research-status">${['全部','待核实','暂停入组','未招募'].map(t=>`<option ${t===researchStatus?'selected':''}>${t}</option>`).join('')}</select></label></form><p class="muted" role="status">当前显示 ${list.length} / ${PROJECTS.length} 项</p>${list.map(p=>`<button class="project-listitem" data-action="detail" data-id="${p.id}"><span class="mini-icon">${p.id.slice(-2)}</span><span><b>${p.id}</b><small>${esc(p.name)}</small><span class="pill ${researchStatusOf(p)==='待核实'?'':researchStatusOf(p)==='暂停入组'?'red':'amber'}">${esc(p.status)}</span></span><span>›</span></button>`).join('')||'<div class="card empty">没有符合条件的项目。</div>'}${researchQuery||researchStatus!=='全部'?'<button type="button" data-action="research-clear" class="quiet full">清除筛选，查看全部项目</button>':''}</section>`;
}
const researchBaseRender=render,researchBaseAction=action;
action=function(a,id){if(a==='reset'||a==='research-clear'){researchQuery='';researchStatus='全部';if(a==='research-clear'){render();return}}return researchBaseAction(a,id)};
